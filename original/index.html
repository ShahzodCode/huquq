<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LEX="https://lex.uz/docs/-6445145";
const CHECKED="2026-yil 10-noyabr";

/* ---------- storage ---------- */
const store={get(k,d){try{const v=localStorage.getItem("kh_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("kh_"+k,JSON.stringify(v))}catch(e){}}};
const P=store.get("progress",{read:[],quiz:{},sitDone:[],sortBest:0,blitzBest:0,findBest:0});
const save=()=>store.set("progress",P);

/* ---------- index constitution ---------- */
const SECT_SHORT=["Asosiy prinsiplar","Huquqlar, erkinliklar va burchlar","Jamiyat va shaxs","Ma'muriy-hududiy tuzilish","Davlat hokimiyati","O'zgartirish tartibi"].map(s=>s.replace(/'/g,"ʼ").replace("Maʼ","Maʼ").replace("Oʼz","Oʻz"));
const SCOL=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)"];
const ART={};
K.sections.forEach((s,si)=>s.chapters.forEach(c=>c.articles.forEach(a=>{ART[a.n]=Object.assign({},a,{sec:si,secTitle:s.title,chap:c.title})})));
const norm=s=>s.toLowerCase().replace(/[ʻʼ'‘’`´]/g,"'").replace(/ё/g,"е");
const plainArt=n=>ART[n].text.join(" ");

/* ---------- icons ---------- */
const I={
 bosh:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 huquqlar:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 oquvchi:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/>',
 burchlar:'<path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>',
 sinov:'<path d="M9 3h6l1 3h3v15H5V6h3z"/><path d="M9 13l2 2 4-4"/>',
 vaziyatlar:'<path d="M4 5h16v11H9l-5 4z"/><path d="M9 9h6M9 12h4"/>',
 qidiruv:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 manbalar:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',
 yana:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
 star:'<path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.1l1.5-7L2 9.3l7-.8z"/>'
};
const ico=(k,extra="")=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${I[k]}</svg>`;
const ROUTES=[
 ["bosh","Bosh sahifa","Sayt maqsadi va Konstitutsiya bir qarashda"],
 ["huquqlar","Mening huquqlarim","Shaxsiy, siyosiy, iqtisodiy, ijtimoiy va madaniy huquqlar"],
 ["oquvchi","Oʻquvchi huquqlari","Taʼlim, bolalar va yoshlar huquqlari"],
 ["burchlar","Fuqarolik burchlarim","Qonunga rioya, hurmat, tabiat va merosni asrash"],
 ["sinov","Huquqiy bilim sinovi","36 savol, “Moddani toping!” va “Huquqiy bilimdon”"],
 ["vaziyatlar","Hayotiy vaziyatlar","8 ta voqea: qaysi huquq buzildi?"],
 ["qidiruv","Konstitutsiyadan qidirish","Modda raqami yoki kalit soʻz boʻyicha"],
 ["manbalar","Foydali manbalar","Rasmiy matn, lugʻat va qoidalar"]
];
$("#nav").innerHTML=ROUTES.map(([k,n])=>`<a href="#${k}" data-r="${k}">${ico(k)}<span>${n}</span></a>`).join("");
const TABS=["bosh","huquqlar","sinov","qidiruv"];
const tabName={bosh:"Bosh",huquqlar:"Huquqlar",sinov:"Sinov",qidiruv:"Qidiruv"};
$("#tabbar").innerHTML=TABS.map(k=>`<a href="#${k}" data-r="${k}">${ico(k)}<span>${tabName[k]}</span></a>`).join("")+`<button id="more" aria-haspopup="dialog">${ico("yana")}<span>Yana</span></button>`;
$("#sheet").innerHTML=ROUTES.filter(r=>!TABS.includes(r[0])).map(([k,n])=>`<a href="#${k}">${ico(k)}${n}</a>`).join("")+`<div class="tools"><button class="tbtn" data-fs="-1" aria-label="Matnni kichraytirish">A−</button><button class="tbtn" data-fs="1" aria-label="Matnni kattalashtirish">A+</button><button class="tbtn" data-theme-toggle>Tungi rejim</button></div>`;

/* ---------- settings ---------- */
let fs=store.get("fs",17), theme=store.get("theme",matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
const applySet=()=>{document.documentElement.style.setProperty("--fs",fs+"px");document.documentElement.dataset.theme=theme;$$("[data-theme-toggle]").forEach(b=>b.textContent=theme==="dark"?"Kunduzgi rejim":"Tungi rejim")};
applySet();
document.addEventListener("click",e=>{
 const f=e.target.closest("[data-fs]"); if(f){fs=Math.min(22,Math.max(14,fs+ +f.dataset.fs));store.set("fs",fs);applySet();}
 if(e.target.closest("[data-theme-toggle]")){theme=theme==="dark"?"light":"dark";store.set("theme",theme);applySet();}
 const a=e.target.closest("[data-art]"); if(a){e.preventDefault();openArt(+a.dataset.art);}
 const t=e.target.closest(".term"); if(t){showTerm(t);return}
 if(!e.target.closest(".pop")) $("#pop").style.display="none";
});

/* ---------- glossary terms ---------- */
const GL={}; CONTENT.glossary.forEach(g=>GL[norm(g.t)]=g);
const TERM_RE=new RegExp("\\b("+["daxlsiz","prezumpsiya","referendum","senzura","inklyuziv","ombudsman","advokat","mansabdor shaxs","vijdon erkinligi","muqobil"].join("|")+")[a-zʻʼ]*","gi");
const termKey={daxlsiz:"daxlsizlik",prezumpsiya:"aybsizlik prezumpsiyasi",referendum:"referendum",senzura:"senzura",inklyuziv:"inklyuziv taʼlim",ombudsman:"ombudsman",advokat:"advokat","mansabdor shaxs":"mansabdor shaxs","vijdon erkinligi":"vijdon erkinligi",muqobil:"muqobil xizmat"};
const withTerms=s=>esc(s).replace(TERM_RE,(m,base)=>{const g=GL[norm(termKey[base.toLowerCase()]||base)];return g?`<button class="term" data-t="${esc(g.t)}">${m}</button>`:m});
function showTerm(btn){const g=CONTENT.glossary.find(x=>x.t===btn.dataset.t);const p=$("#pop");p.innerHTML=`<b>${esc(g.t)}</b>${esc(g.d)}`;p.style.display="block";const r=btn.getBoundingClientRect();p.style.left=Math.min(innerWidth-296,Math.max(8,r.left))+"px";p.style.top=(r.bottom+8)+"px";}

/* ---------- helpers ---------- */
const artChips=arts=>`<div class="chips">${arts.map(n=>`<button class="art" data-art="${n}" aria-label="${n}-moddani ochish">${n}-modda</button>`).join("")}</div>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",1800)};
const foot=()=>`<footer class="foot">Sayt umumiy maʼrifiy maqsadga xizmat qiladi va rasmiy huquqiy maslahat oʻrnini bosmaydi. Modda matnlari <a href="${LEX}">lex.uz</a> rasmiy manbasidan oʻzgarishsiz olingan; oxirgi tekshiruv: ${CHECKED}. Saytdan foydalanish uchun hech qanday shaxsiy maʼlumot talab qilinmaydi.</footer>`;

/* ---------- drawer ---------- */
let lastFocus=null;
function openArt(n){
 const a=ART[n]; if(!a) return;
 lastFocus=document.activeElement;
 if(!P.read.includes(n)){P.read.push(n);save();}
 const rel=CONTENT.rights.filter(r=>r.arts.includes(n)).concat(CONTENT.duties.filter(r=>r.arts.includes(n)));
 const d=$("#drawer");
 d.innerHTML=`<div class="dhead"><div><div class="num" id="dnum">${n}-modda</div><div class="where">${esc(SECT_SHORT[a.sec])}${a.chap?" · "+esc(a.chap):""}</div></div><button class="close" id="dclose" aria-label="Yopish">×</button></div>
 <div class="dbody"><div class="official">Rasmiy matn — oʻzgarishsiz</div>${a.text.map(p=>`<p class="para">${esc(p)}</p>`).join("")}
 ${a.notes?`<div class="note">${a.notes.map(esc).join("<br>")}</div>`:""}
 ${rel.length?`<div class="related"><h4>Sodda tilda</h4>${rel.map(r=>`<p><b>${esc(r.title)}.</b> ${esc(r.simple)}</p>`).join("")}</div>`:""}</div>
 <div class="dfoot"><a class="btn" href="${LEX}#${a.anchor}" target="_blank" rel="noopener">Rasmiy manbada ochish</a><button class="btn ghost" id="dcopy">Matndan nusxa olish</button>
 ${n>1?`<button class="btn soft" data-art="${n-1}" aria-label="Oldingi modda">‹ ${n-1}</button>`:""}${n<155?`<button class="btn soft" data-art="${n+1}" aria-label="Keyingi modda">${n+1} ›</button>`:""}</div>`;
 d.classList.add("on");$("#scrim").classList.add("on");$("#dclose").focus();
 $("#dclose").onclick=closeArt;
 $("#dcopy").onclick=async()=>{try{await navigator.clipboard.writeText(`${n}-modda. ${a.text.join("\n")}\nManba: ${LEX}`);toast("Nusxa olindi")}catch(e){toast("Nusxa olib boʻlmadi — matnni belgilab oling")}};
}
function closeArt(){$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");$("#sheet").classList.remove("on");if(lastFocus)lastFocus.focus();}
$("#scrim").onclick=closeArt;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeArt()});
$("#more").onclick=()=>{lastFocus=$("#more");$("#sheet").classList.add("on");$("#scrim").classList.add("on");$("#sheet a").focus()};
$("#sheet").addEventListener("click",e=>{if(e.target.closest("a"))closeArt()});

/* ---------- views ---------- */
const V={};

V.bosh=()=>{
 const dayN=CONTENT.findPool[Math.floor(Date.now()/864e5)%CONTENT.findPool.length];
 const badges=[
  ["Kashfiyotchi","10 ta moddani oʻqing",P.read.length>=10],
  ["Test ustasi","Istalgan darajada 10+ ball",Object.values(P.quiz).some(v=>v>=10)],
  ["Vaziyat tahlilchisi","8 ta vaziyatni yeching",P.sitDone.length>=8],
  ["Huquq yoki burch","Saralashda 14/14",P.sortBest>=14],
  ["Huquqiy bilimdon","Bilimdon oʻyinida 15+ ball",P.blitzBest>=15],
  ["Modda ovchisi","“Moddani toping!”da 8+",P.findBest>=8]];
 return `<section class="hero">
  <div><div class="kicker">2023-yilgi yangi tahrir asosida</div>
   <h1>Konstitutsiyam — huquqiy kelajagim</h1>
   <p class="lead">Asosiy qonunimiz 155 moddadan iborat. Bu yerda ularni oʻz tilingda oʻqiysan, oʻz huquqing va burchingni topasan, bilimingni oʻyinlar va hayotiy vaziyatlarda sinab koʻrasan.</p>
   <div class="actions"><a class="btn" href="#huquqlar">Huquqlarimni koʻrish</a><a class="btn ghost" href="#sinov">Bilimimni sinash</a></div>
  </div>
  <div class="wall" aria-label="155 modda: har bir koshin — bitta modda">
   <p class="wallcap"><b>155 modda — 155 koshin</b><span>Koshinni bosing</span></p>
   <div class="tiles" id="tiles">${Object.values(ART).map(a=>`<button class="tile" data-art="${a.n}" data-sec="${a.sec}" style="background:${SCOL[a.sec]}" aria-label="${a.n}-modda, ${esc(SECT_SHORT[a.sec])}">${a.n}</button>`).join("")}</div>
   <div class="legend">${SECT_SHORT.map((s,i)=>`<button data-sec="${i}" aria-pressed="false"><i style="background:${SCOL[i]}"></i>${i+1}. ${esc(s)}</button>`).join("")}</div>
  </div>
 </section>
 <div class="facts"><div><b>155</b><span>modda</span></div><div><b>27</b><span>bob</span></div><div><b>6</b><span>boʻlim va muqaddima</span></div><div><b>30.04.2023</b><span>umumxalq referendumida qabul qilingan</span></div></div>
 <section class="section"><h2>Bugungi modda</h2><p class="muted">Har kuni yangi modda bilan tanishing.</p>
  <div class="daycard"><div class="num">${dayN}</div><div><p>${esc(ART[dayN].text[0])}</p><button class="btn" data-art="${dayN}">Toʻliq oʻqish</button></div></div></section>
 <section class="section"><h2>Boʻlimlar</h2><p class="muted">“Mening huquqim qaysi?”, “Bunday vaziyatda nima qilishim kerak?”, “Bilimimni qanday tekshiraman?” — javoblar shu yerda.</p>
  <div class="qnav">${ROUTES.slice(1).map(([k,n,d])=>`<a href="#${k}"><h3>${ico(k)}${n}</h3><p>${d}</p></a>`).join("")}</div></section>
 <section class="section"><h2>Mening yutuqlarim</h2><p class="muted">Natijalar faqat shu qurilmada saqlanadi. Oʻqilgan moddalar: ${P.read.length} / 155.</p>
  <div class="badges">${badges.map(([t,d,on])=>`<div class="badge ${on?"on":""}">${ico("star")}<div><b>${t}</b><br>${d}</div></div>`).join("")}</div></section>
 ${foot()}`;
};
V.bosh.after=()=>{
 const lg=$$(".legend button");
 lg.forEach(b=>b.onclick=()=>{const on=b.getAttribute("aria-pressed")!=="true";lg.forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed",String(on));$$(".tile").forEach(t=>t.classList.toggle("dim",on&&t.dataset.sec!==b.dataset.sec));});
};

let rightsCat="hammasi";
V.huquqlar=()=>`<div class="head"><h1>Mening huquqlarim</h1><p class="lead">Har bir kartada huquq sodda tilda tushuntirilgan, hayotiy misol berilgan va rasmiy modda koʻrsatilgan. Modda raqamini bossangiz, uning rasmiy matni ochiladi.</p></div>
 <div class="gstrip">${CONTENT.guarantees.map(g=>`<div class="card"><h3>${esc(g.title)}</h3><p>${withTerms(g.simple)}</p>${artChips(g.arts)}</div>`).join("")}</div>
 <div class="seg" role="group" aria-label="Huquq turini tanlash" id="cats"><button data-c="hammasi" aria-pressed="true">Hammasi</button>${CONTENT.cats.map(c=>`<button data-c="${c.id}" aria-pressed="false">${esc(c.name.replace(" huquqlar",""))}</button>`).join("")}</div>
 <p class="muted" id="catdesc" style="margin:12px 0 16px"></p>
 <div class="grid g2" id="rgrid"></div>${foot()}`;
V.huquqlar.after=()=>{
 const draw=()=>{
  const c=CONTENT.cats.find(x=>x.id===rightsCat);
  $("#catdesc").textContent=c?c.desc:`${CONTENT.rights.length} ta huquq, 5 turkum.`;
  $("#rgrid").innerHTML=CONTENT.rights.filter(r=>rightsCat==="hammasi"||r.cat===rightsCat).map(r=>`<article class="card rcard"><div class="cat">${esc(CONTENT.cats.find(x=>x.id===r.cat).name)}</div><h3>${esc(r.title)}</h3><p>${withTerms(r.simple)}</p><div class="example"><b>Misol:</b> ${esc(r.example)}</div>
   <details class="flip"><summary>Rasmiy matndan parcha</summary><blockquote>${esc(ART[r.arts[0]].text[0])}</blockquote></details>${artChips(r.arts)}</article>`).join("");
 };
 $$("#cats button").forEach(b=>b.onclick=()=>{rightsCat=b.dataset.c;$$("#cats button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));draw()});
 $$("#cats button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.c===rightsCat)));draw();
};

let dayI=0;
V.oquvchi=()=>`<div class="head"><h1>Oʻquvchi huquqlari</h1><p class="lead">${esc(CONTENT.student.intro)}</p></div>
 <div class="grid g2">${CONTENT.student.cards.map(c=>`<article class="card"><h3>${esc(c.title)}</h3><p>${withTerms(c.simple)}</p>${artChips(c.arts)}</article>`).join("")}</div>
 <section class="section"><h2>Bir kun maktabda</h2><p class="muted">Ertalabdan kechgacha — har bir lahzada qaysi huquq seni himoya qiladi?</p>
 <div class="day"><div class="times" role="tablist" aria-label="Kun vaqtlari">${CONTENT.student.day.map((d,i)=>`<button role="tab" aria-selected="${i===dayI}" data-i="${i}"><b>${d.time}</b><span>${esc(d.title)}</span></button>`).join("")}</div>
 <div class="dayview" id="dayview" role="tabpanel" aria-live="polite"></div></div></section>${foot()}`;
V.oquvchi.after=()=>{
 const draw=()=>{const d=CONTENT.student.day[dayI];$("#dayview").innerHTML=`<div class="clock">${d.time}</div><h3 style="margin:6px 0 8px">${esc(d.title)}</h3><p>${esc(d.text)}</p>${artChips(d.arts)}<div class="daynav"><button class="btn soft" id="dprev" ${dayI===0?"disabled":""}>‹ Oldingi</button><button class="btn" id="dnext" ${dayI===CONTENT.student.day.length-1?"disabled":""}>Keyingi ›</button></div>`;
  $$(".times button").forEach(b=>b.setAttribute("aria-selected",String(+b.dataset.i===dayI)));
  $("#dprev").onclick=()=>{dayI--;draw()};$("#dnext").onclick=()=>{dayI++;draw()};};
 $$(".times button").forEach(b=>b.onclick=()=>{dayI=+b.dataset.i;draw()});draw();
};

V.burchlar=()=>`<div class="head"><h1>Fuqarolik burchlarim</h1><p class="lead">Huquqlar burchlar bilan birga yashaydi. Konstitutsiyaning XI bobi fuqarolarning burchlarini belgilaydi.</p></div>
 <div class="grid g2">${CONTENT.duties.map(d=>`<article class="card rcard"><h3>${esc(d.title)}</h3><p>${withTerms(d.simple)}</p><div class="example"><b>Misol:</b> ${esc(d.example)}</div>${artChips(d.arts)}</article>`).join("")}</div>
 <section class="section"><h2>Huquqmi yoki burchmi?</h2><p class="muted">Har bir jumlani toʻgʻri qutiga joylang: tugmani bosing yoki kartani qutiga sudrang.</p><div class="game" id="sortg"></div></section>${foot()}`;
V.burchlar.after=()=>{
 let deck,i,score,placed;
 const start=()=>{deck=shuffle(CONTENT.sort);i=0;score=0;placed={huquq:[],burch:[]};draw()};
 const draw=()=>{
  const g=$("#sortg");
  if(i>=deck.length){P.sortBest=Math.max(P.sortBest,score);save();g.innerHTML=`<div class="result"><div class="big">${score}/${deck.length}</div><p>${score===deck.length?"Ajoyib! Huquq va burchni aniq farqlaysiz.":"Yaxshi natija. Xatolarni modda matnidan tekshirib, yana urinib koʻring."}</p><button class="btn" id="sagain">Qaytadan</button></div>`;$("#sagain").onclick=start;return}
  const c=deck[i];
  g.innerHTML=`<div class="gtop"><span>${i+1} / ${deck.length}</span><div class="bar"><i style="width:${i/deck.length*100}%"></i></div><span>Toʻgʻri: ${score}</span></div>
  <div class="sortcard" draggable="true" id="scard">${esc(c.s)}</div>
  <div class="bins"><button class="bin h" data-k="huquq"><h3>Huquq <span>${placed.huquq.length}</span></h3><ul>${placed.huquq.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></button><button class="bin b" data-k="burch"><h3>Burch <span>${placed.burch.length}</span></h3><ul>${placed.burch.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></button></div><div id="sfb" aria-live="polite"></div>`;
  const pick=k=>{if(g.dataset.lock)return;g.dataset.lock=1;const ok=k===c.k;if(ok)score++;placed[c.k].push(c.s);
   $("#sfb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><strong>${ok?"Toʻgʻri!":"Bu "+(c.k==="huquq"?"huquq":"burch")+"."}</strong>${c.art}-moddaga qarang. ${artChips([c.art])}<div class="row"><button class="btn" id="snext">Davom etish</button></div></div>`;
   $$(".bin",g).forEach(b=>b.disabled=true);$("#snext").focus();$("#snext").onclick=()=>{delete g.dataset.lock;i++;draw()}};
  $$(".bin",g).forEach(b=>{b.onclick=()=>pick(b.dataset.k);b.ondragover=e=>{e.preventDefault();b.classList.add("drag")};b.ondragleave=()=>b.classList.remove("drag");b.ondrop=e=>{e.preventDefault();b.classList.remove("drag");pick(b.dataset.k)}});
  $("#scard").ondragstart=e=>e.dataTransfer.setData("text/plain","x");
 };
 start();
};

let gameTab="test", lvl=1;
V.sinov=()=>`<div class="head"><h1>Huquqiy bilim sinovi</h1><p class="lead">Uch xil sinov: darajali test, rasmiy matndan moddani topish va tezkor “Huquqiy bilimdon”. Har bir javob rasmiy modda bilan izohlanadi.</p></div>
 <div class="seg" role="group" aria-label="Sinov turi" id="gtabs"><button data-g="test">Test (36 savol)</button><button data-g="find">Moddani toping!</button><button data-g="blitz">Huquqiy bilimdon</button></div>
 <div class="game" id="game"></div>${foot()}`;
V.sinov.after=()=>{
 const tabs=$$("#gtabs button");
 const go=g=>{gameTab=g;tabs.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.g===g)));clearInterval(blitzT);({test:testIntro,find:findGame,blitz:blitzIntro})[g]()};
 tabs.forEach(b=>b.onclick=()=>go(b.dataset.g));go(gameTab);
};
const LV=["","Boshlangʻich","Oʻrta","Yuqori"];
function testIntro(){
 const g=$("#game");
 g.innerHTML=`<h2>Darajani tanlang</h2><p class="muted">Har bir darajada 12 ta savol. Natija shu qurilmada saqlanadi.</p>
 <div class="grid g3" style="margin-top:14px">${[1,2,3].map(l=>`<button class="opt" data-l="${l}" style="flex-direction:column;align-items:flex-start"><b style="font-family:var(--display)">${l}. ${LV[l]}</b><span class="muted">${["","Davlat ramzlari, asosiy huquqlar","Huquqlar kafolatlari, taʼlim, mehnat","Davlat tuzilishi, sud, Konstitutsiyaviy tartib"][l]}</span><span>${P.quiz[l]!=null?"Eng yaxshi natija: "+P.quiz[l]+"/12":"Hali topshirilmagan"}</span></button>`).join("")}</div>`;
 $$("[data-l]",g).forEach(b=>b.onclick=()=>{lvl=+b.dataset.l;runTest()});
}
function runTest(){
 const qs=shuffle(CONTENT.quiz.filter(q=>q.lvl===lvl));let i=0,score=0;const g=$("#game");
 const draw=()=>{
  if(i>=qs.length){P.quiz[lvl]=Math.max(P.quiz[lvl]||0,score);save();g.innerHTML=`<div class="result"><div class="muted">${LV[lvl]} daraja</div><div class="big">${score}/${qs.length}</div><p>${score>=10?"Aʼlo! Siz Konstitutsiyani yaxshi bilasiz.":score>=7?"Yaxshi! Xato qilgan moddalaringizni qayta oʻqib chiqing.":"Boshlanishi yaxshi. “Mening huquqlarim” boʻlimini koʻrib chiqib, yana urinib koʻring."}</p><div class="row" style="justify-content:center"><button class="btn" id="tagain">Qaytadan</button><button class="btn ghost" id="tlv">Boshqa daraja</button></div></div>`;$("#tagain").onclick=runTest;$("#tlv").onclick=testIntro;return}
  const q=qs[i];const order=shuffle(q.o.map((t,k)=>k));
  g.innerHTML=`<div class="gtop"><span>${LV[lvl]} · ${i+1}/${qs.length}</span><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><span>Ball: ${score}</span></div>
  <p class="qtext">${esc(q.q)}</p><div class="opts">${order.map((k,j)=>`<button class="opt" data-k="${k}"><span class="k">${"ABCD"[j]}</span>${esc(q.o[k])}</button>`).join("")}</div><div id="tfb" aria-live="polite"></div>`;
  $$(".opt",g).forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===q.a;if(ok)score++;
   $$(".opt",g).forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("ok")});if(!ok)b.classList.add("no");
   $("#tfb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><strong>${ok?"Toʻgʻri!":"Notoʻgʻri."}</strong>${esc(q.why)}${artChips([q.art])}<div class="row"><button class="btn" id="tnext">${i+1<qs.length?"Keyingi savol":"Natijani koʻrish"}</button></div></div>`;
   $("#tnext").focus();$("#tnext").onclick=()=>{i++;draw()}});
 };draw();
}
function findGame(){
 const g=$("#game");const rounds=shuffle(CONTENT.findPool).slice(0,10);let i=0,score=0;
 const draw=()=>{
  if(i>=rounds.length){P.findBest=Math.max(P.findBest,score);save();g.innerHTML=`<div class="result"><div class="big">${score}/10</div><p>Modda raqamlarini eslab qolish — huquqingizni tez himoya qilishga yordam beradi.</p><button class="btn" id="fagain">Yana oʻynash</button></div>`;$("#fagain").onclick=findGame;return}
  const n=rounds[i];const txt=ART[n].text[0];const cut=txt.length>220?txt.slice(0,220).replace(/\s\S*$/,"")+"…":txt;
  const opts=shuffle([n,...shuffle(CONTENT.findPool.filter(x=>x!==n)).slice(0,3)]);
  g.innerHTML=`<div class="gtop"><span>Moddani toping! · ${i+1}/10</span><div class="bar"><i style="width:${i*10}%"></i></div><span>Ball: ${score}</span></div>
  <p class="muted">Bu jumla Konstitutsiyaning qaysi moddasidan olingan?</p><blockquote class="quote">“${esc(cut)}”</blockquote>
  <div class="numopts">${opts.map(o=>`<button class="opt" data-n="${o}">${o}</button>`).join("")}</div><div id="ffb" aria-live="polite"></div>`;
  $$(".opt",g).forEach(b=>b.onclick=()=>{const ok=+b.dataset.n===n;if(ok)score++;$$(".opt",g).forEach(x=>{x.disabled=true;if(+x.dataset.n===n)x.classList.add("ok")});if(!ok)b.classList.add("no");
   const rel=CONTENT.rights.find(r=>r.arts.includes(n))||CONTENT.duties.find(r=>r.arts.includes(n));
   $("#ffb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><strong>${ok?"Topdingiz!":"Bu "+n+"-modda."}</strong>${rel?esc(rel.title)+": "+esc(rel.simple):esc(SECT_SHORT[ART[n].sec])+(ART[n].chap?" — "+esc(ART[n].chap):"")}${artChips([n])}<div class="row"><button class="btn" id="fnext">Keyingisi</button></div></div>`;$("#fnext").focus();$("#fnext").onclick=()=>{i++;draw()}});
 };draw();
}
let blitzT=null;
function blitzIntro(){
 $("#game").innerHTML=`<div class="blitz"><h2>Huquqiy bilimdon</h2><p class="muted">60 soniya ichida iloji boricha koʻp gapga “Toʻgʻri” yoki “Notoʻgʻri” deb javob bering. Toʻgʻri javob +1, xato −1. Klaviaturada: ← notoʻgʻri, → toʻgʻri.</p><p>Eng yaxshi natija: <b>${P.blitzBest}</b></p><button class="btn" id="bstart">Boshlash</button></div>`;
 $("#bstart").onclick=blitzRun;
}
function blitzRun(){
 const deck=shuffle(CONTENT.blitz);let i=0,score=0,left=60,log=[];const g=$("#game");
 g.innerHTML=`<div class="blitz"><div class="gtop"><span class="timer" id="btime">60</span><span>Ball: <b id="bscore">0</b></span></div><div class="stmt" id="bstmt" aria-live="polite"></div><div class="tf"><button class="f" data-v="0">Notoʻgʻri</button><button class="t" data-v="1">Toʻgʻri</button></div></div>`;
 const show=()=>{$("#bstmt").textContent=deck[i%deck.length].s};
 const end=()=>{clearInterval(blitzT);document.removeEventListener("keydown",kb);P.blitzBest=Math.max(P.blitzBest,score);save();
  g.innerHTML=`<div class="result"><div class="muted">Vaqt tugadi</div><div class="big">${score}</div><p>${log.length} ta javob. Xatolaringiz:</p>${log.filter(l=>!l.ok).map(l=>`<p style="text-align:left">✗ ${esc(l.s)} — <b>${l.t?"Toʻgʻri":"Notoʻgʻri"}</b> <button class="art" data-art="${l.art}">${l.art}-modda</button></p>`).join("")||"<p>Xato yoʻq — zoʻr!</p>"}<div class="row" style="justify-content:center"><button class="btn" id="bagain">Yana oʻynash</button></div></div>`;$("#bagain").onclick=blitzRun};
 const ans=v=>{const c=deck[i%deck.length];const ok=v===c.t;score+=ok?1:-1;if(score<0)score=0;log.push({s:c.s,t:c.t,art:c.art,ok});$("#bscore").textContent=score;
  const s=$("#bstmt");s.classList.remove("flash","bad");void s.offsetWidth;s.classList.add("flash");if(!ok)s.classList.add("bad");i++;if(i>=deck.length*2){end();return}show()};
 const kb=e=>{if(e.key==="ArrowLeft")ans(false);if(e.key==="ArrowRight")ans(true)};
 document.addEventListener("keydown",kb);
 $$(".tf button",g).forEach(b=>b.onclick=()=>ans(b.dataset.v==="1"));
 show();blitzT=setInterval(()=>{left--;const t=$("#btime");if(!t){clearInterval(blitzT);document.removeEventListener("keydown",kb);return}t.textContent=left;if(left<=0)end()},1000);
}

let sitOpen=null;
V.vaziyatlar=()=>`<div class="head"><h1>Hayotiy vaziyatlar</h1><p class="lead">Har bir voqeani oʻqing, qaysi huquq buzilganini va qaysi moddaga tayanish mumkinligini aniqlang. Oxirida — amaliy maslahatlar.</p></div>
 <div id="sitwrap"></div>${foot()}`;
V.vaziyatlar.after=()=>{sitOpen==null?sitList():sitRun(sitOpen)};
function sitList(){
 sitOpen=null;
 $("#sitwrap").innerHTML=`<p class="muted">Yechilgan: ${P.sitDone.length} / ${CONTENT.situations.length}</p><div class="grid g2 sitlist">${CONTENT.situations.map((s,i)=>`<button class="card" data-s="${i}"><h3>${i+1}. ${esc(s.title)}</h3><p class="muted" style="font-size:.92rem">${esc(s.story.slice(0,120))}…</p>${P.sitDone.includes(i)?`<span class="done">✓ Yechilgan</span>`:""}</button>`).join("")}</div>`;
 $$("[data-s]").forEach(b=>b.onclick=()=>sitRun(+b.dataset.s));
}
function sitRun(idx){
 sitOpen=idx;const s=CONTENT.situations[idx];let step=0;const w=$("#sitwrap");
 const shell=body=>`<div class="game"><div class="row" style="margin:0 0 14px;justify-content:space-between"><button class="btn soft" id="sback">‹ Barcha vaziyatlar</button><span class="muted">${idx+1} / ${CONTENT.situations.length}</span></div><div class="steps">${[0,1,2].map(k=>`<span class="${k<=step?"on":""}"></span>`).join("")}</div><h2>${esc(s.title)}</h2><p class="story" style="margin-top:12px">${esc(s.story)}</p>${body}</div>`;
 const bind=()=>{$("#sback").onclick=sitList};
 const q=(key,label,fmt)=>{const Q=s[key];const order=shuffle(Q.o.map((x,k)=>k));
  w.innerHTML=shell(`<p class="qtext" style="margin-top:18px">${label}</p><div class="opts">${order.map((k,j)=>`<button class="opt" data-k="${k}"><span class="k">${"ABC"[j]}</span>${fmt(Q.o[k])}</button>`).join("")}</div><div id="sfb2" aria-live="polite"></div>`);bind();
  $$(".opt",w).forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===Q.a;
   if(!ok){b.classList.add("no");b.disabled=true;$("#sfb2").innerHTML=`<div class="fb no"><strong>Yana oʻylab koʻring.</strong>Voqeada aynan nima buzilganiga eʼtibor bering.</div>`;return}
   b.classList.add("ok");$$(".opt",w).forEach(x=>x.disabled=true);
   $("#sfb2").innerHTML=`<div class="fb ok"><strong>Toʻgʻri!</strong>${key==="q2"?artChips([Q.o[Q.a]]):""}<div class="row"><button class="btn" id="snext2">Davom etish</button></div></div>`;$("#snext2").focus();$("#snext2").onclick=()=>{step++;next()}});
 };
 const next=()=>{
  if(step===0) q("q1","1-qadam. Qaysi huquq buzildi?",esc);
  else if(step===1) q("q2","2-qadam. Qaysi moddaga tayanish mumkin?",n=>`<b>${n}-modda</b>&nbsp;— ${esc(ART[n].text[0].slice(0,90))}…`);
  else{ if(!P.sitDone.includes(idx)){P.sitDone.push(idx);save()}
   w.innerHTML=shell(`<h3 style="margin-top:20px">3-qadam. Nima qilish kerak?</h3><ol class="todo">${s.steps.map(x=>`<li>${withTerms(x)}</li>`).join("")}</ol><p class="muted" style="font-size:.86rem">Bu umumiy maʼrifiy maslahat. Jiddiy holatda kattalar, maktab maʼmuriyati yoki huquqshunosga murojaat qiling.</p><div class="row">${idx+1<CONTENT.situations.length?`<button class="btn" id="snextsit">Keyingi vaziyat</button>`:""}<button class="btn ghost" id="slist">Roʻyxatga qaytish</button></div>`);bind();
   $("#slist").onclick=sitList;const nx=$("#snextsit");if(nx)nx.onclick=()=>sitRun(idx+1);}
  $("#view").scrollIntoView({block:"start"});
 };next();
}

let lastQ="";
V.qidiruv=()=>`<div class="head"><h1>Konstitutsiyadan qidirish</h1><p class="lead">Modda raqamini (masalan, <b>50</b>) yoki kalit soʻzni (masalan, <b>taʼlim</b>, <b>internet</b>) yozing. Qidiruv barcha 155 moddaning rasmiy matni boʻyicha ishlaydi.</p></div>
 <form class="sbox" id="sform" role="search"><label for="q" class="sr">Qidiruv</label>${ico("qidiruv",'width="22" height="22" style="color:var(--xira)"')}<input id="q" type="search" autocomplete="off" placeholder="Modda raqami yoki kalit soʻz" value="${esc(lastQ)}"><button class="btn" type="submit">Qidirish</button></form>
 <div class="hints">${["taʼlim","bola","internet","sud","mehnat","tabiat","saylov","oila","sogʻliq","til"].map(h=>`<button data-h="${h}">${h}</button>`).join("")}</div>
 <div class="res" id="res" aria-live="polite"></div>
 <section class="section toc"><h2>Mundarija</h2><p class="muted">Muqaddima, 6 boʻlim, 27 bob, 155 modda.</p>
 <details><summary>Muqaddima</summary><div class="chap">${K.preamble.map(p=>`<p class="para">${esc(p)}</p>`).join("")}</div></details>
 ${K.sections.map((s,si)=>`<details><summary>${si+1}-boʻlim. ${esc(SECT_SHORT[si])}</summary><div class="chap">${s.chapters.map(c=>`${c.title?`<h4>${esc(c.title)}</h4>`:""}<div class="nums">${c.articles.map(a=>`<button data-art="${a.n}" aria-label="${a.n}-modda">${a.n}</button>`).join("")}</div>`).join("")}</div></details>`).join("")}
 </section>${foot()}`;
V.qidiruv.after=()=>{
 const run=()=>{
  const raw=$("#q").value.trim();lastQ=raw;const box=$("#res");
  if(!raw){box.innerHTML="";return}
  const num=raw.match(/^(\d{1,3})(-?modda)?$/i);
  if(num){const n=+num[1];box.innerHTML=ART[n]?row(n,ART[n].text[0]):`<p class="muted">Konstitutsiyada ${n}-modda yoʻq. Moddalar 1 dan 155 gacha.</p>`;return}
  const q=norm(raw);if(q.length<2){box.innerHTML=`<p class="muted">Kamida 2 ta harf yozing.</p>`;return}
  const hits=[];
  Object.values(ART).forEach(a=>{const p=a.text.find(t=>norm(t).includes(q));if(p)hits.push([a.n,p])});
  box.innerHTML=hits.length?`<p class="muted">${hits.length} ta modda topildi</p>`+hits.slice(0,60).map(([n,p])=>row(n,p,q)).join(""):`<p class="muted">“${esc(raw)}” soʻzi topilmadi. Soʻzning boshqa shaklini sinab koʻring (masalan, “taʼlim” oʻrniga “taʼl”).</p>`;
 };
 const row=(n,p,q)=>{let t=p.length>240?(()=>{if(!q)return p.slice(0,240)+"…";const at=Math.max(0,norm(p).indexOf(q)-80);return(at?"…":"")+p.slice(at,at+240)+"…"})():p;
  let h=esc(t);if(q){const nt=norm(t);let out="",last=0,idx;while((idx=nt.indexOf(q,last))>-1){out+=esc(t.slice(last,idx))+"<mark>"+esc(t.slice(idx,idx+q.length))+"</mark>";last=idx+q.length}h=out+esc(t.slice(last))}
  return `<button data-art="${n}"><span class="n">${n}-modda</span><span class="ch">${esc(ART[n].chap||SECT_SHORT[ART[n].sec])}</span><p>${h}</p></button>`};
 $("#sform").onsubmit=e=>{e.preventDefault();run()};
 $("#q").oninput=()=>{clearTimeout(run.t);run.t=setTimeout(run,180)};
 $$("[data-h]").forEach(b=>b.onclick=()=>{$("#q").value=b.dataset.h;run()});
 if(lastQ)run();
};

V.manbalar=()=>`<div class="head"><h1>Foydali manbalar</h1><p class="lead">Saytdagi barcha modda matnlari rasmiy manbadan oʻzgarishsiz olingan. Quyida — asl manbalar, lugʻat va saytning ishlash qoidalari.</p></div>
 <div class="grid g2 srcs">${CONTENT.sources.map(s=>`<div class="card"><h3><a href="${s.url}" target="_blank" rel="noopener">${esc(s.name)}</a></h3><p class="muted" style="font-size:.9rem">${esc(s.note)}</p><p style="font-size:.8rem;word-break:break-all" class="muted">${esc(s.url)}</p></div>`).join("")}</div>
 <div class="notice"><b>Matn tahriri haqida.</b> Saytda Konstitutsiyaning 2023-yil 30-apreldagi yangi tahriri, 2026-yil 13-iyuldagi OʻRQ-1158-sonli Konstitutsiyaviy Qonun bilan kiritilgan oʻzgartishlar bilan birga (15, 109, 131, 134, 151-moddalar) keltirilgan. Oxirgi tekshiruv: ${CHECKED}. Qonunchilikda oʻzgarish boʻlsa, matn qayta tekshiriladi.</div>
 <section class="section"><h2>Huquqiy lugʻat</h2><p class="muted">Matnda nuqtali chiziq bilan belgilangan soʻzni bossangiz, uning maʼnosi chiqadi.</p>
 <div class="gloss">${CONTENT.glossary.map(g=>`<div><b>${esc(g.t)}</b>${esc(g.d)}</div>`).join("")}</div></section>
 <section class="section"><h2>Sayt qoidalari</h2><ol class="todo">
  <li>Konstitutsiya moddalari rasmiy manbadan (lex.uz) olingan va oʻzgartirilmagan; har bir izoh yonida modda raqami va rasmiy manbaga havola bor.</li>
  <li>Sodda tushuntirishlar va misollar maʼrifiy maqsadda yozilgan va oʻqituvchi tomonidan tekshiriladi.</li>
  <li>Saytdan foydalanish uchun pasport, telefon, manzil yoki boshqa shaxsiy maʼlumot soʻralmaydi. Test natijalari faqat sizning qurilmangizda saqlanadi.</li>
  <li>Rasmlar sayt uchun maxsus chizilgan.</li>
  <li>Sayt rasmiy huquqiy maslahat oʻrnini bosmaydi.</li></ol>
  <div class="row"><button class="btn ghost" id="reset">Natijalarimni tozalash</button></div></section>${foot()}`;
V.manbalar.after=()=>{$("#reset").onclick=()=>{Object.assign(P,{read:[],quiz:{},sitDone:[],sortBest:0,blitzBest:0,findBest:0});save();toast("Natijalar tozalandi")}};

/* ---------- router ---------- */
function route(){
 clearInterval(blitzT);
 let h=(location.hash||"#bosh").slice(1);
 let art=null;const m=h.match(/^modda-(\d+)$/);if(m){art=+m[1];h="qidiruv"}
 if(!V[h])h="bosh";
 $("#view").innerHTML=V[h]();if(V[h].after)V[h].after();
 $$("[data-r]").forEach(a=>{if(a.dataset.r===h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
 document.title=(ROUTES.find(r=>r[0]===h)||ROUTES[0])[1]+" — Konstitutsiyam";
 window.scrollTo(0,0);
 if(art&&ART[art])openArt(art);
}
addEventListener("hashchange",()=>{closeArt();route()});
route();
})();
</script>
