) Oʻzbekiston Respublikasi Oliy Majlisining Senati, boshqa davlat organlari, chet davlatlar, xalqaro va boshqa tashkilotlar bilan oʻzaro munosabatlarda Qonunchilik palatasi nomidan ish koʻradi;","7) Qonunchilik palatasi qarorlarini imzolaydi;","8) ushbu Konstitutsiya va qonun hujjatlarida nazarda tutilgan boshqa vakolatlarni amalga oshiradi.","Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi Spikeri farmoyishlar chiqaradi."]},{"n":101,"anchor":"-6445910","text":["Oʻzbekiston Respublikasi Oliy Majlisining Senati oʻz tarkibidan Senat Raisi va uning oʻrinbosarlarini saylaydi. Senat Raisi Oʻzbekiston Respublikasi Prezidentining taqdimiga binoan saylanadi.","Oʻzbekiston Respublikasi Oliy Majlisining Senati Raisi oʻrinbosarlaridan biri Qoraqalpogʻiston Respublikasining vakili boʻladi.","Oʻzbekiston Respublikasi Oliy Majlisining Senati Raisi va uning oʻrinbosarlari yashirin ovoz berish orqali senatorlar umumiy sonining koʻpchilik ovozi bilan Senat vakolati muddatiga saylanadi.","Ayni bir shaxs surunkasiga ikki muddatdan ortiq Oʻzbekiston Respublikasi Oliy Majlisi Senatining Raisi boʻlishi mumkin emas.","Oʻzbekiston Respublikasi Oliy Majlisining Senati Raisi va uning oʻrinbosarlari yashirin ovoz berish orqali senatorlar umumiy sonining uchdan ikki qismidan koʻprogʻining ovozi bilan qabul qilingan Senat qaroriga binoan muddatidan ilgari chaqirib olinishi mumkin.","Oʻzbekiston Respublikasi Oliy Majlisining Senati Raisi:","1) Senat majlislarini chaqiradi, ularda raislik qiladi;","2) Senat muhokamasiga kiritiladigan masalalarni tayyorlashga umumiy rahbarlik qiladi;","3) Senat qoʻmitalari va komissiyalarining faoliyatini muvofiqlashtirib boradi;","4) Oʻzbekiston Respublikasi qonunlarining va Senat qarorlarining ijrosi ustidan nazoratni tashkil etadi;","5) parlamentlararo aloqalarni amalga oshirish ishlariga hamda xalqaro parlament tashkilotlari ishi bilan bogʻliq Senat guruhlarining faoliyatiga rahbarlik qiladi;","6) Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi, boshqa davlat organlari, chet davlatlar, xalqaro va boshqa tashkilotlar bilan oʻzaro munosabatlarda Senat nomidan ish koʻradi;","7) Senat qarorlarini imzolaydi;","8) ushbu Konstitutsiya va qonun hujjatlarida nazarda tutilgan boshqa vakolatlarni amalga oshiradi.","Oʻzbekiston Respublikasi Oliy Majlisining Senati Raisi farmoyishlar chiqaradi."]},{"n":102,"anchor":"-6445926","text":["Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi qonun loyihalarini tayyorlash ishini olib borish, Qonunchilik palatasi muhokamasiga kiritiladigan masalalarni dastlabki tarzda koʻrib chiqish va tayyorlash, Oʻzbekiston Respublikasi qonunlari hamda Qonunchilik palatasi tomonidan qabul qilinadigan qarorlarning ijrosini nazorat qilish uchun oʻz vakolatlari muddatiga Qonunchilik palatasi deputatlari orasidan qoʻmitalarni saylaydi.","Oʻzbekiston Respublikasi Oliy Majlisining Senati Senat muhokamasiga kiritiladigan masalalarni dastlabki tarzda koʻrib chiqish va tayyorlash, Oʻzbekiston Respublikasi qonunlari hamda Senat tomonidan qabul qilinadigan qarorlarning ijrosini nazorat qilish uchun oʻz vakolatlari muddatiga senatorlar orasidan qoʻmitalarni saylaydi.","Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi va Senati, zarurat boʻlgan taqdirda, muayyan vazifalarni bajarish uchun deputatlar, senatorlar orasidan komissiyalar tuzadi."]},{"n":103,"anchor":"-6445931","text":["Mamlakatning xavfsizligi, barqaror rivojlanishi asoslariga salbiy taʼsir koʻrsatishi mumkin boʻlgan, inson huquqlari va erkinliklariga, jamiyat va davlat manfaatlariga tahdid soladigan faktlar va voqealarni oʻrganish maqsadida Oʻzbekiston Respublikasi Oliy Majlisi Qonunchilik palatasi va Senatining qoʻshma qarori bilan parlament tekshiruvi oʻtkazilishi mumkin.","Parlament tekshiruvini oʻtkazish uchun Oʻzbekiston Respublikasi Oliy Majlisi Qonunchilik palatasi deputatlari va Senati aʼzolari orasidan tenglik asosida maxsus komissiya tuzilib, u oʻz faoliyatini qonunga muvofiq amalga oshiradi."]},{"n":104,"anchor":"-6445934","text":["Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi deputatlariga va Senati aʼzolariga ularning deputatlik yoki senatorlik faoliyati bilan bogʻliq xarajatlar belgilangan tartibda qoplanadi.","Qonunchilik palatasi deputatlari hamda Senatda doimiy asosda ishlovchi Senat aʼzolari oʻz vakolatlari davrida ilmiy, ijodiy va pedagogik faoliyatdan tashqari haq toʻlanadigan boshqa turdagi faoliyat bilan shugʻullanishlari mumkin emas.","Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi deputati va Senati aʼzosi daxlsizlik huquqidan foydalanadilar. Ular tegishincha Qonunchilik palatasi yoki Senatning roziligisiz jinoiy javobgarlikka tortilishi, ushlab turilishi, qamoqqa olinishi yoki sud tartibida beriladigan maʼmuriy jazo choralariga tortilishi mumkin emas."]}]},{"title":"XIX bob. Oʻzbekiston Respublikasining Prezidenti","articles":[{"n":105,"anchor":"-6445940","text":["Oʻzbekiston Respublikasining Prezidenti davlat boshligʻidir va davlat hokimiyati organlarining kelishilgan holda faoliyat yuritishini hamda hamkorligini taʼminlaydi."]},{"n":106,"anchor":"-6445942","text":["Oʻzbekiston Respublikasi Prezidenti lavozimiga oʻttiz besh yoshdan kichik boʻlmagan, davlat tilini yaxshi biladigan, bevosita saylovgacha kamida 10 yil Oʻzbekiston hududida muqim yashayotgan Oʻzbekiston Respublikasi fuqarosi saylanishi mumkin. Ayni bir shaxs surunkasiga ikki muddatdan ortiq Oʻzbekiston Respublikasining Prezidenti boʻlishi mumkin emas.","Oʻzbekiston Respublikasining Prezidenti Oʻzbekiston Respublikasining fuqarolari tomonidan umumiy, teng va toʻgʻridan-toʻgʻri saylov huquqi asosida yashirin ovoz berish yoʻli bilan yetti yil muddatga saylanadi. Oʻzbekiston Respublikasining Prezidentini saylash tartibi qonun bilan belgilanadi."]},{"n":107,"anchor":"-6445945","text":["Oʻzbekiston Respublikasi Prezidenti oʻz vazifasini bajarib turgan davrda boshqa haq toʻlanadigan lavozimni egallashi, vakillik organining deputati boʻlishi, tadbirkorlik faoliyati bilan shugʻullanishi mumkin emas.","Oʻzbekiston Respublikasi Prezidentining shaxsi daxlsizdir va qonun bilan muhofaza etiladi."]},{"n":108,"anchor":"-6445949","text":["Oʻzbekiston Respublikasi Prezidenti Oʻzbekiston Respublikasi Oliy Majlisi yigʻilishida quyidagi qasamyodni qabul qilgan paytdan boshlab oʻz lavozimiga kirishgan hisoblanadi:","“Oʻzbekiston xalqiga sadoqat bilan xizmat qilishga, respublikaning Konstitutsiyasi va qonunlariga qatʼiy rioya etishga, fuqarolarning huquqlari va erkinliklariga kafolat berishga, Oʻzbekiston Respublikasi Prezidenti zimmasiga yuklatilgan vazifalarni vijdonan bajarishga tantanali qasamyod qilaman”."]},{"n":109,"anchor":"-6445952","text":["Oʻzbekiston Respublikasining Prezidenti:","1) fuqarolarning huquqlari va erkinliklariga, Oʻzbekiston Respublikasining Konstitutsiyasi va qonunlariga rioya etilishining, Oʻzbekiston Respublikasi suvereniteti, xavfsizligi va hududiy yaxlitligining kafilidir, milliy-davlat tuzilishi masalalariga doir qarorlarni amalga oshirish yuzasidan zarur chora-tadbirlar koʻradi;","2) mamlakat ichkarisida va xalqaro munosabatlarda Oʻzbekiston Respublikasi nomidan ish koʻradi;","3) muzokaralar olib boradi hamda Oʻzbekiston Respublikasining shartnoma va bitimlarini imzolaydi, respublika tomonidan tuzilgan shartnomalarga, bitimlarga va uning qabul qilingan majburiyatlariga rioya etilishini taʼminlaydi;","4) oʻz huzurida akkreditatsiyadan oʻtgan diplomatik hamda boshqa vakillarning ishonch va chaqiruv yorliqlarini qabul qiladi;","5) Oʻzbekiston Respublikasining chet davlatlardagi va xalqaro tashkilotlar huzuridagi diplomatik hamda boshqa vakolatxonalarining rahbarlarini tayinlash uchun nomzodlarni Oʻzbekiston Respublikasi Oliy Majlisining Senatiga taqdim etadi;","6) Oʻzbekiston Respublikasi xalqiga hamda Oliy Majlisiga mamlakat ichki va tashqi siyosatini amalga oshirishning eng muhim masalalari yuzasidan murojaat qilish huquqiga ega;","7) vazirliklarni va boshqa respublika ijro etuvchi hokimiyat organlarini tuzadi hamda tugatadi, shu masalalarga doir farmonlarni keyinchalik Oʻzbekiston Respublikasi Oliy Majlisining Senati tasdigʻiga kiritadi;","8) Senat Raisi lavozimiga saylash uchun nomzodni Oʻzbekiston Respublikasi Oliy Majlisining Senatiga taqdim etadi;","9) Oʻzbekiston Respublikasi Bosh vazirini, Oʻzbekiston Respublikasi Vazirlar Mahkamasi aʼzolarini Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi maʼqullaganidan keyin lavozimga tayinlaydi va ularni lavozimidan ozod etadi;","10) qoʻmitalar, agentliklar va boshqa respublika davlat organlari rahbarlarini qonunchilikka muvofiq lavozimga tayinlaydi va lavozimidan ozod etadi;","11) Oʻzbekiston Respublikasi Bosh prokurorini, Oʻzbekiston Respublikasi Hisob palatasi raisini Oʻzbekiston Respublikasi Oliy Majlisining Senati maʼqullaganidan keyin lavozimga tayinlaydi va ularni lavozimidan ozod etadi;","12) Oʻzbekiston Respublikasi Oliy Majlisining Senati bilan maslahatlashuvlardan keyin Oʻzbekiston Respublikasi Davlat xavfsizlik xizmati raisini lavozimga tayinlaydi va uni lavozimidan ozod etadi;","13) Oʻzbekiston Respublikasi Oliy Majlisining Senatiga Oʻzbekiston Respublikasi Konstitutsiyaviy sudi, Oʻzbekiston Respublikasi Oliy sudi, Oʻzbekiston Respublikasi Sudyalar oliy kengashi tarkiblariga nomzodlarni, shuningdek Oʻzbekiston Respublikasi Markaziy banki boshqaruvining raisi, respublika korrupsiyaga qarshi kurashish organining rahbari va respublika monopoliyaga qarshi organining rahbari lavozimlariga nomzodlarni taqdim etadi;","14) Oʻzbekiston Respublikasi Sudyalar oliy kengashining taqdimiga binoan viloyatlar va Toshkent shahar sudlari raislarini va rais oʻrinbosarlarini, Oʻzbekiston Respublikasi Harbiy sudi raisini tayinlaydi va lavozimidan ozod etadi;","15) viloyatlar hokimlarini va Toshkent shahar hokimini tayinlaydi hamda lavozimidan ozod etadi. Konstitutsiyani, qonunlarni buzgan yoki hokim shaʼni va qadr-qimmatiga dogʻ tushiradigan xatti-harakat sodir etgan tuman va shahar hokimlarini Oʻzbekiston Respublikasi Prezidenti oʻz qarori bilan lavozimidan ozod etishga haqli;","16) respublika ijro etuvchi hokimiyat organlarining va hokimlarning hujjatlarini toʻxtatadi, bekor qiladi; Oʻzbekiston Respublikasi Vazirlar Mahkamasi majlislarida raislik qilishga haqli;","17) Oʻzbekiston Respublikasining qonunlarini imzolaydi va eʼlon qiladi; qonunni oʻz eʼtirozlari bilan takroran muhokama qilish va ovozga qoʻyish uchun Oʻzbekiston Respublikasi Oliy Majlisiga qaytarishga haqli;","18) Oʻzbekiston Respublikasiga hujum qilinganda yoki tajovuzdan bir-birini mudofaa qilish yuzasidan tuzilgan shartnoma majburiyatlarini bajarish zaruriyati tugʻilganda urush holati, umumiy yoki qisman safarbarlik eʼlon qiladi va qabul qilgan qarorini uch kun ichida Oʻzbekiston Respublikasi Oliy Majlisi palatalarining tasdigʻiga kiritadi;","19) alohida hollarda (real tashqi xavf, ommaviy tartibsizliklar, yirik halokat, tabiiy ofat, epidemiyalar) fuqarolarning xavfsizligini taʼminlashni koʻzlab, Oʻzbekiston Respublikasining butun hududida yoki uning ayrim joylarida favqulodda holat joriy etadi va qabul qilgan qarorini uch kun ichida Oʻzbekiston Respublikasi Oliy Majlisining palatalari tasdigʻiga kiritadi. Favqulodda holat joriy etish shartlari va tartibi qonun bilan belgilanadi;","20) Oʻzbekiston Respublikasi Qurolli Kuchlarining Oliy Bosh qoʻmondoni hisoblanadi, Qurolli Kuchlarning oliy qoʻmondonlarini tayinlaydi va lavozimidan ozod etadi, oliy harbiy unvonlar beradi;","21) Oʻzbekiston Respublikasining ordenlari, medallari va yorligʻi bilan mukofotlaydi, Oʻzbekiston Respublikasining malakaviy va faxriy unvonlarini beradi;","22) Oʻzbekiston Respublikasining fuqaroligiga va siyosiy boshpana berishga oid masalalarni hal etadi;","23) amnistiya toʻgʻrisidagi hujjatlarni qabul qilish haqida Oʻzbekiston Respublikasi Oliy Majlisining Senatiga taqdimnomalar kiritadi va Oʻzbekiston Respublikasining sudlari tomonidan hukm qilingan shaxslarni afv etadi;","24) Oʻzbekiston Respublikasi Prezidenti huzuridagi Xavfsizlik kengashini tuzadi va unga boshchilik qiladi, shuningdek Oʻzbekiston Respublikasi Prezidenti huzuridagi maslahat-kengash organlarini hamda boshqa organlarni shakllantiradi;","24¹) Oʻzbekiston Respublikasi Prezidenti oʻz vakolatlarini amalga oshirishni tashkiliy, huquqiy, tahliliy jihatdan taʼminlash maqsadida Oʻzbekiston Respublikasi Prezidenti Administratsiyasini shakllantiradi hamda uning Rahbarini tayinlaydi.","Oʻzbekiston Respublikasi Prezidenti Administratsiyasining huquqiy maqomi, asosiy vazifalari, faoliyatini tashkil etish tartibi va vakolatlari qonun bilan belgilanadi;","25) ushbu Konstitutsiya va qonunlarda nazarda tutilgan boshqa vakolatlarni amalga oshiradi.","Oʻzbekiston Respublikasi Prezidenti oʻz vakolatlarini bajarishni davlat organlariga yoki mansabdor shaxslarga topshirishga haqli emas."],"notes":["(109-modda birinchi qismining 24-bandi Oʻzbekiston Respublikasining 2026-yil 13-iyuldagi OʻRQ-1158-sonli Konstitutsiyaviy Qonuni tahririda — Qonunchilik maʼlumotlari milliy bazasi, 14.07.2026-y., 03/26/1158/0727-son. Kuchga kirish sanasi — 2026-yil 25-iyul)","(109-moddaning birinchi qismi Oʻzbekiston Respublikasining 2026-yil 13-iyuldagi OʻRQ-1158-sonli Konstitutsiyaviy Qonuniga asosan 24¹-band bilan toʻldirilgan — Qonunchilik maʼlumotlari milliy bazasi, 14.07.2026-y., 03/26/1158/0727-son. Kuchga kirish sanasi — 2026-yil 25-iyul)"]},{"n":110,"anchor":"-6445984","text":["Oʻzbekiston Respublikasining Prezidenti Konstitutsiyaga va qonunlarga asoslanib hamda ularni ijro etish yuzasidan respublikaning butun hududida majburiy kuchga ega boʻlgan farmonlar, qarorlar va farmoyishlar chiqaradi."]},{"n":111,"anchor":"-6445987","text":["Qonunchilik palatasi yoki Senat tarkibida ularning normal faoliyatiga tahdid soluvchi hal qilib boʻlmaydigan ixtiloflar yuz berganda yoxud ular bir necha marta Oʻzbekiston Respublikasining Konstitutsiyasiga zid qarorlar qabul qilgan taqdirda, shuningdek Qonunchilik palatasi bilan Senat oʻrtasida Oʻzbekiston Respublikasi Oliy Majlisining normal faoliyatiga tahdid soluvchi hal qilib boʻlmaydigan ixtiloflar yuz berganda Oʻzbekiston Respublikasi Prezidentining Oʻzbekiston Respublikasi Konstitutsiyaviy sudi bilan bamaslahat qabul qilgan qarori asosida Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi, Senati tarqatib yuborilishi mumkin.","Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi, Senati tarqatib yuborilgan taqdirda yangi saylov uch oy mobaynida oʻtkaziladi.","Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi va Senati favqulodda holat amal qilishi davrida tarqatib yuborilishi mumkin emas."]},{"n":112,"anchor":"-6445991","text":["Oʻzbekiston Respublikasining amaldagi Prezidenti oʻz vazifalarini bajara olmaydigan holatlarda uning vazifa va vakolatlari vaqtincha Oʻzbekiston Respublikasi Oliy Majlisi Senati Raisining zimmasiga yuklatiladi, bunda uch oy muddat ichida qonunga toʻliq muvofiq holda Oʻzbekiston Respublikasi Prezidenti saylovi oʻtkaziladi."]},{"n":113,"anchor":"-6445993","text":["Vakolati tugashi munosabati bilan isteʼfoga chiqqan Oʻzbekiston Respublikasi Prezidenti umrbod Oʻzbekiston Respublikasi Oliy Majlisi Senati aʼzosi lavozimini egallaydi."]}]},{"title":"XX bob. Oʻzbekiston Respublikasi Vazirlar Mahkamasi","articles":[{"n":114,"anchor":"-6445997","text":["Oʻzbekiston Respublikasi Vazirlar Mahkamasi ijro etuvchi hokimiyatni amalga oshiradi. Oʻzbekiston Respublikasi Vazirlar Mahkamasi Oʻzbekiston Respublikasi Bosh vaziri, uning oʻrinbosarlari va vazirlardan iborat. Qoraqalpogʻiston Respublikasi hukumatining boshligʻi Vazirlar Mahkamasi tarkibiga oʻz lavozimi boʻyicha kiradi.","Vazirlar Mahkamasi oʻz faoliyatini ijro etuvchi hokimiyat faoliyatining Oʻzbekiston Respublikasi Prezidenti tomonidan belgilanadigan asosiy yoʻnalishlari doirasida amalga oshiradi."]},{"n":115,"anchor":"-6446000","text":["Oʻzbekiston Respublikasi Vazirlar Mahkamasi:","1) samarali iqtisodiy, ijtimoiy, soliq va budjet siyosati amalga oshirilishi, ilm-fan, madaniyat, taʼlim, sogʻliqni saqlashni hamda iqtisodiyotning va ijtimoiy sohaning boshqa tarmoqlarini rivojlantirishga doir dasturlarning ishlab chiqilishi hamda bajarilishi uchun javobgar boʻladi;","2) barqaror iqtisodiy oʻsishni, makroiqtisodiy barqarorlikni taʼminlash, kambagʻallikni qisqartirish, aholi uchun munosib turmush sharoitlarini yaratish, oziq-ovqat xavfsizligini taʼminlash, qulay investitsiyaviy muhitni yaratish, hududlarni kompleks va barqaror rivojlantirish boʻyicha choralar koʻradi;","3) aholini, shu jumladan nogironligi boʻlgan shaxslarni ijtimoiy himoya qilish tizimining samarali faoliyat koʻrsatishini taʼminlaydi;","4) atrof-muhitni muhofaza qilish, tabiiy boyliklarni va biologik xilma-xillikni saqlash, iqlim oʻzgarishiga, epidemiyalarga, pandemiyalarga qarshi kurashish hamda ularning oqibatlarini yumshatish sohalarida yagona davlat siyosati amalga oshirilishini taʼminlaydi;","5) yoshlarga oid davlat siyosatining amalga oshirilishini taʼminlaydi, oilani qoʻllab-quvvatlash, mustahkamlash va himoya qilish, anʼanaviy oilaviy qadriyatlarni saqlash boʻyicha choralar koʻradi;","6) fuqarolik jamiyati institutlarini qoʻllab-quvvatlash chora-tadbirlarini amalga oshiradi, ijtimoiy-iqtisodiy rivojlantirish hamda ijtimoiy sheriklik dasturlarini ishlab chiqish va amalga oshirishda ularning ishtirok etishini taʼminlaydi;","7) fuqarolarning iqtisodiy, ijtimoiy hamda boshqa huquqlari va qonuniy manfaatlarini himoya qilish boʻyicha chora-tadbirlarni amalga oshiradi;","8) Oʻzbekiston Respublikasi Konstitutsiyasi va qonunlari, Oliy Majlis palatalari qarorlari, Oʻzbekiston Respublikasi Prezidenti farmonlari, qarorlari va farmoyishlari ijrosini taʼminlaydi;","9) ijro etuvchi hokimiyat organlari ishini muvofiqlashtiradi va yoʻnaltiradi, ularning faoliyati ustidan qonunda belgilangan tartibda nazoratni amalga oshiradi;","10) ijro etuvchi hokimiyat organlarining ishida ochiqlik va shaffoflikni, qonuniylik va samaradorlikni taʼminlash, ularning faoliyatida korrupsiya holatlariga qarshi kurashish, davlat xizmatlarining sifatini oshirish va ulardan foydalanish imkoniyatini kengaytirish boʻyicha choralar koʻradi;","11) Oʻzbekiston Respublikasi Oliy Majlisi Qonunchilik palatasiga mamlakat ijtimoiy-iqtisodiy hayotining eng muhim masalalari yuzasidan har yilgi maʼruzalarni taqdim etadi;","12) ushbu Konstitutsiya va qonunlarda nazarda tutilgan boshqa vakolatlarni amalga oshiradi."]},{"n":116,"anchor":"-6446014","text":["Vazirlar Mahkamasi konstitutsiyaviy normalar doirasida va qonunchilikka muvofiq Oʻzbekiston Respublikasining butun hududidagi barcha organlar, korxonalar, muassasalar, tashkilotlar, mansabdor shaxslar va fuqarolar tomonidan bajarilishi majburiy boʻlgan qarorlar va farmoyishlar chiqaradi.","Vazirlar Mahkamasi oʻz faoliyatida Oʻzbekiston Respublikasi Oliy Majlisi va Oʻzbekiston Respublikasi Prezidenti oldida javobgardir.","Amaldagi Vazirlar Mahkamasi yangi saylangan Oʻzbekiston Respublikasi Oliy Majlisi oldida oʻz vakolatlarini zimmasidan soqit qiladi, biroq Vazirlar Mahkamasining yangi tarkibi shakllantirilguniga qadar Oʻzbekiston Respublikasi Prezidentining qaroriga muvofiq oʻz faoliyatini davom ettirib turadi."]},{"n":117,"anchor":"-6446019","text":["Oʻzbekiston Respublikasi Bosh vaziri:","1) Vazirlar Mahkamasi faoliyatini tashkil etadi va unga rahbarlik qiladi, uning samarali ishlashi uchun shaxsan javobgar boʻladi;","2) Vazirlar Mahkamasining majlislarida raislik qiladi, uning qarorlarini imzolaydi;","3) xalqaro munosabatlarda Oʻzbekiston Respublikasi Vazirlar Mahkamasi nomidan ish koʻradi;","4) Oʻzbekiston Respublikasi qonunlarida nazarda tutilgan boshqa vazifalarni bajaradi."]},{"n":118,"anchor":"-6446025","text":["Oʻzbekiston Respublikasi Bosh vaziri nomzodi Oʻzbekiston Respublikasi Oliy Majlisi palatalarining mansabdor shaxslari saylangandan va organlari shakllangandan soʻng bir oy ichida yoki Bosh vazir lavozimidan ozod etilganidan keyin yoxud Bosh vazir, Vazirlar Mahkamasining amaldagi tarkibi isteʼfoga chiqqanidan keyin bir oy ichida Qonunchilik palatasi koʻrib chiqishi va maʼqullashi uchun Oʻzbekiston Respublikasi Prezidenti tomonidan barcha siyosiy partiyalar fraksiyalari bilan maslahatlashuvlar oʻtkazilganidan soʻng taqdim etiladi.","Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi Oʻzbekiston Respublikasi Prezidenti tomonidan taqdim etilgan Oʻzbekiston Respublikasi Bosh vaziri nomzodini taqdimnoma kiritilgan kundan eʼtiboran oʻn kun ichida koʻrib chiqadi.","Bosh vazir lavozimiga nomzod Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasida uning nomzodi koʻrib chiqilayotganda Vazirlar Mahkamasining yaqin muddatga va uzoq istiqbolga moʻljallangan harakat dasturini taqdim etadi.","Bosh vazir nomzodi uning uchun Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi deputatlari umumiy sonining yarmidan koʻpi tomonidan ovoz berilgan taqdirda maʼqullangan hisoblanadi.","Bosh vazir lavozimiga taqdim etilgan nomzod uch marta rad etilgan taqdirda, Oʻzbekiston Respublikasi Prezidenti Bosh vazirni tayinlaydi va Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasini tarqatib yuborishga haqli.","Oʻzbekiston Respublikasi Vazirlar Mahkamasining aʼzolari ularning nomzodlari Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi tomonidan maʼqullanganidan keyin Oʻzbekiston Respublikasi Prezidenti tomonidan lavozimga tayinlanadi.","Oʻzbekiston Respublikasi Prezidenti Bosh vazirni, Oʻzbekiston Respublikasi Vazirlar Mahkamasining amaldagi tarkibini yoki aʼzosini isteʼfoga chiqarishga haqli.","Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi Oʻzbekiston Respublikasi Vazirlar Mahkamasi aʼzosining oʻz faoliyatiga oid masalalar yuzasidan hisobotini eshitishga haqli. Vazirlar Mahkamasi aʼzosining hisobotini eshitish yakunlariga koʻra Qonunchilik palatasi uni isteʼfoga chiqarish toʻgʻrisidagi taklifni Oʻzbekiston Respublikasi Prezidentiga koʻrib chiqish uchun kiritishga haqli.","Oʻzbekiston Respublikasi Vazirlar Mahkamasi aʼzolari parlament soʻrovlariga va Qonunchilik palatasi deputatining, Senat aʼzosining soʻrovlariga qonunda belgilangan tartibda javob berishi shart.","Vazirlar Mahkamasining faoliyatini tashkil etish tartibi va vakolat doirasi qonun bilan belgilanadi."]},{"n":119,"anchor":"-6446036","text":["Oʻzbekiston Respublikasi Bosh vaziri va Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi oʻrtasida ziddiyatlar doimiy tus olgan holda Qonunchilik palatasi deputatlari umumiy sonining kamida uchdan bir qismi tomonidan Oʻzbekiston Respublikasi Prezidenti nomiga rasman kiritilgan taklif boʻyicha Oʻzbekiston Respublikasi Oliy Majlisi Qonunchilik palatasining muhokamasiga Bosh vazirga nisbatan ishonchsizlik votumi bildirish haqidagi masala kiritiladi.","Bosh vazirga nisbatan ishonchsizlik votumi, agar Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi deputatlari umumiy sonining kamida uchdan ikki qismi ovoz bersa, qabul qilingan hisoblanadi. Bunday holatda Oʻzbekiston Respublikasi Prezidenti Bosh vazirni lavozimidan ozod etish toʻgʻrisida qaror qabul qiladi. Bunda Oʻzbekiston Respublikasi Vazirlar Mahkamasining butun tarkibi Bosh vazir bilan birga isteʼfoga chiqadi."]}]},{"title":"XXI bob. Mahalliy davlat hokimiyati asoslari. Fuqarolarning oʻzini oʻzi boshqarish organlari","articles":[{"n":120,"anchor":"-6446041","text":["Viloyatlar, tumanlar va shaharlarda (tumanga boʻysunadigan shaharlardan tashqari) xalq deputatlari Kengashlari davlat hokimiyati vakillik organlaridir.","Xalq deputatlari Kengashiga uning deputatlari orasidan qonunga muvofiq saylanadigan rais boshchilik qiladi.","Viloyat, tuman, shahar hokimi lavozimini egallab turgan shaxs bir vaqtning oʻzida xalq deputatlari Kengashining raisi lavozimini egallashi mumkin emas.","Xalq deputatlari Kengashlarining vakolatlari muddati — besh yil. Ayni bir shaxs surunkasiga ikki muddatdan ortiq ayni bir viloyat, tuman, shahar xalq deputatlari Kengashining raisi etib saylanishi mumkin emas.","Xalq deputatlari Kengashlari deputatlari saylovi va xalq deputatlari Kengashlarining faoliyatini tashkil etish tartibi qonun bilan belgilanadi.","Yangidan tashkil etilgan maʼmuriy-hududiy birliklarda xalq deputatlari Kengashlariga saylov xalq deputatlari Kengashlariga navbatdagi umumiy saylovlarga qadar qolgan davrdan oshmaydigan muddatga oʻtkaziladi."]},{"n":121,"anchor":"-6446049","text":["Tegishli hududdagi ijro etuvchi hokimiyatga viloyat, tuman va shahar hokimi boshchilik qiladi.","Hokimlarning vakolatlari muddati — besh yil. Ayni bir shaxs surunkasiga ikki muddatdan ortiq ayni bir viloyat, tuman, shaharning hokimi etib tayinlanishi mumkin emas.","Hokimlarning faoliyatini tashkil etish tartibi qonun bilan belgilanadi."]},{"n":122,"anchor":"-6446054","text":["Xalq deputatlari Kengashlarining vakolatlari quyidagilardan iborat:","1) tegishli mahalliy budjetlarni koʻrib chiqish va qabul qilish, ularning ijro etilishi ustidan nazoratni amalga oshirish;","2) hududlarni ijtimoiy-iqtisodiy rivojlantirish va aholini ijtimoiy himoya qilish dasturlarini tasdiqlash;","3) hokimni lavozimga tasdiqlash, uning faoliyati toʻgʻrisidagi hisobotlarni eshitish;","4) ushbu Konstitutsiya va qonunlarda nazarda tutilgan boshqa vakolatlarni amalga oshirish."]},{"n":123,"anchor":"-6446060","text":["Viloyatlar, tumanlar, shaharlar hokimlarining vakolatlari quyidagilardan iborat:","1) Oʻzbekiston Respublikasining Konstitutsiyasi va qonunlarini, Oliy Majlis palatalarining qarorlarini, Oʻzbekiston Respublikasi Prezidentining farmonlari, qarorlari hamda farmoyishlarini, Vazirlar Mahkamasining, yuqori turuvchi hokimlarning va tegishli xalq deputatlari Kengashlarining qarorlarini bajarish;","2) hududlarni iqtisodiy, ijtimoiy, madaniy va ekologik jihatdan rivojlantirishni taʼminlashga qaratilgan chora-tadbirlarni amalga oshirish;","3) mahalliy budjetni shakllantirish va ijro etish;","4) ushbu Konstitutsiya va qonunlarda nazarda tutilgan boshqa vakolatlarni amalga oshirish."]},{"n":124,"anchor":"-6446066","text":["Viloyat va Toshkent shahar hokimi Oʻzbekiston Respublikasi Prezidenti tomonidan qonunga muvofiq tayinlanadi va lavozimidan ozod etiladi.","Tuman va shaharlarning hokimlari viloyat, Toshkent shahar hokimi tomonidan tayinlanadi va lavozimidan ozod etiladi hamda tegishli xalq deputatlari Kengashi tomonidan tasdiqlanadi.","Tumanga boʻysunadigan shaharlarning hokimlari tuman hokimi tomonidan tayinlanadi va lavozimidan ozod etiladi hamda xalq deputatlari tuman Kengashi tomonidan tasdiqlanadi."]},{"n":125,"anchor":"-6446070","text":["Viloyat, tuman va shahar hokimi oʻz vakolatlarini yakkaboshchilik asosida amalga oshiradi hamda oʻzi rahbarlik qilayotgan organlarning qarorlari va harakatlari uchun shaxsan javobgar boʻladi.","Viloyat, tuman va shahar hokimi tegishli xalq deputatlari Kengashiga viloyatni, tumanni, shaharni ijtimoiy-iqtisodiy rivojlantirishning eng muhim va dolzarb masalalari yuzasidan hisobotlar taqdim etadi, ushbu hisobotlar boʻyicha xalq deputatlari Kengashi tomonidan tegishli qarorlar qabul qilinadi."]},{"n":126,"anchor":"-6446073","text":["Xalq deputatlari Kengashi va hokim oʻz vakolatlari doirasida tegishli hududdagi barcha tashkilotlar, shuningdek mansabdor shaxslar va fuqarolar tomonidan bajarilishi majburiy boʻlgan qarorlar qabul qiladi."]},{"n":127,"anchor":"-6446075","text":["Shaharchalar, qishloqlar va ovullarda, shuningdek shaharlar, shaharchalar, qishloqlar va ovullardagi mahallalarda fuqarolarning yigʻinlari oʻzini oʻzi boshqarish organlari boʻlib, ular raisni saylaydi.","Fuqarolarning oʻzini oʻzi boshqarish organlari davlat hokimiyati organlari tizimiga kirmaydi hamda mahalliy ahamiyatga molik masalalarni fuqarolarning manfaatlaridan, rivojlanishning tarixiy oʻziga xos xususiyatlaridan, shuningdek milliy qadriyatlardan, mahalliy urf-odatlar va anʼanalardan kelib chiqqan holda, qonunga muvofiq mustaqil ravishda hal etishga haqli.","Davlat fuqarolarning oʻzini oʻzi boshqarish organlari faoliyatini amalga oshirishi uchun zarur shart-sharoitlar yaratadi, ularga qonunda belgilangan vakolatlarini amalga oshirishida koʻmaklashadi.","Fuqarolarning oʻzini oʻzi boshqarish organlari saylovi tartibi, ularning faoliyatini tashkil etish va vakolatlari qonun bilan belgilanadi."]}]},{"title":"XXII bob. Saylov tizimi","articles":[{"n":128,"anchor":"-6446081","text":["Oʻzbekiston Respublikasining fuqarolari davlat hokimiyati vakillik organlariga saylash va saylanish huquqiga egadirlar. Har bir saylovchi bir ovozga ega. Ovoz berish huquqi, oʻz xohish-irodasini bildirish tengligi va erkinligi qonun bilan kafolatlanadi.","Oʻzbekiston Respublikasi Prezidenti saylovi, Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasiga hamda Qoraqalpogʻiston Respublikasi Joʻqorgʻi Kengesiga, viloyatlar, tumanlar, shaharlar davlat hokimiyati vakillik organlariga saylov tegishincha ularning konstitutsiyaviy vakolat muddati tugaydigan yilda — oktabr oyi uchinchi oʻn kunligining birinchi yakshanbasida oʻtkaziladi, bundan ushbu Konstitutsiyada nazarda tutilgan muddatidan ilgari saylov oʻtkazish hollari mustasno. Saylovlar umumiy, teng va toʻgʻridan-toʻgʻri saylov huquqi asosida yashirin ovoz berish yoʻli bilan oʻtkaziladi. Oʻzbekiston Respublikasining oʻn sakkiz yoshga toʻlgan fuqarolari saylash huquqiga ega.","Oʻzbekiston Respublikasi Prezidenti muddatidan ilgari Oʻzbekiston Respublikasi Prezidenti saylovini tayinlashga haqli.","Oʻzbekiston Respublikasi Oliy Majlisining Senati aʼzolari Qoraqalpogʻiston Respublikasi Joʻqorgʻi Kengesi, viloyatlar, tumanlar va shaharlar davlat hokimiyati vakillik organlari deputatlarining tegishli qoʻshma majlislarida mazkur deputatlar saylanganidan soʻng bir oy ichida ular orasidan yashirin ovoz berish yoʻli bilan saylanadilar.","Sud tomonidan muomalaga layoqatsiz deb topilgan fuqarolar, shuningdek sud hukmi bilan ozodlikdan mahrum etish joylarida saqlanayotgan shaxslar saylanishi mumkin emas.","Sud tomonidan muomalaga layoqatsiz deb topilgan fuqarolar, shuningdek ogʻir va oʻta ogʻir jinoyatlar sodir etganlik uchun sudning hukmiga koʻra ozodlikdan mahrum etish joylarida saqlanayotgan shaxslar saylovda ishtirok etish huquqidan faqat qonunga muvofiq hamda sudning qarori asosida mahrum etilishi mumkin. Boshqa har qanday hollarda fuqarolarning saylov huquqlarini toʻgʻridan-toʻgʻri yoki bilvosita cheklashga yoʻl qoʻyilmaydi.","Oʻzbekiston Respublikasi fuqarosi bir vaqtning oʻzida ikkidan ortiq davlat hokimiyati vakillik organining deputati boʻlishi mumkin emas.","Saylov oʻtkazish tartibi qonun bilan belgilanadi."]},{"n":129,"anchor":"-6446090","text":["Oʻzbekiston Respublikasi Prezidenti saylovini, Oʻzbekiston Respublikasi Oliy Majlisiga, viloyatlar, tumanlar, shaharlar davlat hokimiyati vakillik organlariga saylovlarni, shuningdek Oʻzbekiston Respublikasining referendumini tashkil etish va oʻtkazish uchun Oʻzbekiston Respublikasi Oliy Majlisi tomonidan faoliyatining asosiy prinsiplari mustaqillik, qonuniylik, kollegiallik, oshkoralik va adolatlilikdan iborat boʻlgan Oʻzbekiston Respublikasi Markaziy saylov komissiyasi tuziladi.","Oʻzbekiston Respublikasi Markaziy saylov komissiyasi saylov komissiyalari tizimiga boshchilik qiladi, oʻz faoliyatini doimiy asosda amalga oshiradi hamda oʻz faoliyatida Oʻzbekiston Respublikasining Konstitutsiyasiga va qonunlariga amal qiladi.","Oʻzbekiston Respublikasi Markaziy saylov komissiyasining aʼzolari Qoraqalpogʻiston Respublikasi Joʻqorgʻi Kengesining, xalq deputatlari viloyatlar va Toshkent shahar Kengashlarining tavsiyasi boʻyicha Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi va Senati tomonidan saylanadi.","Oʻzbekiston Respublikasi Markaziy saylov komissiyasining raisi Oʻzbekiston Respublikasi Prezidentining taqdimiga binoan komissiya aʼzolari orasidan besh yillik muddatga komissiya majlisida saylanadi. Ayni bir shaxs surunkasiga ikki muddatdan ortiq Oʻzbekiston Respublikasi Markaziy saylov komissiyasining raisi etib saylanishi mumkin emas."]}]},{"title":"XXIII bob. Sud hokimiyati","articles":[{"n":130,"anchor":"-6446096","text":["Oʻzbekiston Respublikasida odil sudlov faqat sud tomonidan amalga oshiriladi.","Oʻzbekiston Respublikasida sud hokimiyati qonun chiqaruvchi va ijro etuvchi hokimiyatdan, siyosiy partiyalardan, fuqarolik jamiyatining boshqa institutlaridan mustaqil holda ish yuritadi."]},{"n":131,"anchor":"-6446099","text":["Oʻzbekiston Respublikasida sud tizimi va sudlar faoliyatining tartibi qonun bilan belgilanadi.","Maxsus huquqiy rejim oʻrnatilgan hududda faoliyati Oʻzbekiston Respublikasining Konstitutsiyaviy Qonuni bilan belgilanadigan ixtisoslashgan sudlar tuzilishi mumkin.","Favqulodda sudlar tuzishga yoʻl qoʻyilmaydi."],"notes":["(131-modda Oʻzbekiston Respublikasining 2026-yil 13-iyuldagi OʻRQ-1158-sonli Konstitutsiyaviy Qonuniga asosan ikkinchi qism bilan toʻldirilgan — Qonunchilik maʼlumotlari milliy bazasi, 14.07.2026-y., 03/26/1158/0727-son. Kuchga kirish sanasi — 2026-yil 25-iyul)"]},{"n":132,"anchor":"-6446102","text":["Oʻzbekiston Respublikasi Konstitutsiyaviy sudi qonun chiqaruvchi va ijro etuvchi hokimiyat hujjatlarining Konstitutsiyaga muvofiqligi toʻgʻrisidagi ishlarni koʻradi.","Konstitutsiyaviy sud Oʻzbekiston Respublikasi Prezidentining taqdimiga binoan Oʻzbekiston Respublikasi Oliy Majlisining Senati tomonidan Oʻzbekiston Respublikasi Sudyalar oliy kengashi tavsiya etgan siyosat va huquq sohasidagi mutaxassislar orasidan, Qoraqalpogʻiston Respublikasi vakilini qoʻshgan holda saylanadi.","Konstitutsiyaviy sudning sudyalari qayta saylanish huquqisiz oʻn yillik muddatga saylanadi.","Oʻzbekiston Respublikasi Konstitutsiyaviy sudi oʻz tarkibidan Oʻzbekiston Respublikasi Konstitutsiyaviy sudining raisini va uning oʻrinbosarini besh yillik muddatga saylaydi."]},{"n":133,"anchor":"-6446107","text":["Oʻzbekiston Respublikasi Konstitutsiyaviy sudi:","1) Oʻzbekiston Respublikasi qonunlarining va Oʻzbekiston Respublikasi Oliy Majlisi palatalari qarorlarining, Oʻzbekiston Respublikasi Prezidenti farmonlari, qarorlari va farmoyishlarining, hukumat, mahalliy davlat hokimiyati organlari qarorlarining, Oʻzbekiston Respublikasi davlatlararo shartnomaviy va boshqa majburiyatlarining Oʻzbekiston Respublikasining Konstitutsiyasiga muvofiqligini aniqlaydi;","2) Oʻzbekiston Respublikasining Prezidenti tomonidan imzolanguniga qadar — Oʻzbekiston Respublikasi konstitutsiyaviy qonunlarining, ratifikatsiya qilish toʻgʻrisidagi Oʻzbekiston Respublikasi qonunlari Oʻzbekiston Respublikasining Prezidenti tomonidan imzolanguniga qadar — Oʻzbekiston Respublikasi xalqaro shartnomalarining Oʻzbekiston Respublikasi Konstitutsiyasiga muvofiqligini aniqlaydi;","3) referendumga chiqarilayotgan masalalarning Oʻzbekiston Respublikasi Konstitutsiyasiga muvofiqligi toʻgʻrisida xulosa beradi;","4) Qoraqalpogʻiston Respublikasi Konstitutsiyasining Oʻzbekiston Respublikasining Konstitutsiyasiga, Qoraqalpogʻiston Respublikasi qonunlarining Oʻzbekiston Respublikasining qonunlariga muvofiqligi toʻgʻrisida xulosa beradi;","5) Oʻzbekiston Respublikasining Konstitutsiyasi va qonunlari normalariga sharh beradi;","6) Oʻzbekiston Respublikasi Oliy sudining muayyan ishda qoʻllanilishi lozim boʻlgan normativ-huquqiy hujjatlarning Oʻzbekiston Respublikasining Konstitutsiyasiga muvofiqligi toʻgʻrisida sudlar tashabbusi bilan kiritilgan murojaatini koʻrib chiqadi;","7) konstitutsiyaviy sudlov ishlarini yuritish amaliyotini umumlashtirish natijalari yuzasidan har yili Oʻzbekiston Respublikasi Oliy Majlisi palatalariga va Oʻzbekiston Respublikasi Prezidentiga mamlakatdagi konstitutsiyaviy qonuniylikning holati toʻgʻrisida axborot taqdim etadi;","8) Oʻzbekiston Respublikasining Konstitutsiyasi va qonunlari bilan berilgan vakolati doirasida boshqa ishlarni koʻrib chiqadi.","Fuqarolar va yuridik shaxslar, agar sud orqali himoya qilishning boshqa barcha vositalaridan foydalanib boʻlingan boʻlsa, sudda koʻrib chiqilishi tugallangan muayyan ishda sud tomonidan oʻziga nisbatan qoʻllanilgan qonunning Konstitutsiyaga muvofiqligi toʻgʻrisidagi shikoyat bilan Oʻzbekiston Respublikasi Konstitutsiyaviy sudiga murojaat qilishga haqli.","Konstitutsiyaviy sudning qarori rasmiy eʼlon qilingan kundan eʼtiboran kuchga kiradi.","Konstitutsiyaviy sudning qarori qatʼiy va uning ustidan shikoyat qilinishi mumkin emas.","Konstitutsiyaviy sudni tashkil etish va uning faoliyati tartibi qonun bilan belgilanadi."]},{"n":134,"anchor":"-6446121","text":["Oʻzbekiston Respublikasi Oliy sudi fuqarolik, jinoiy, iqtisodiy va maʼmuriy sud ishlarini yuritish sohasida sud hokimiyatining oliy organi hisoblanadi, bundan maxsus huquqiy rejim oʻrnatishni nazarda tutuvchi Oʻzbekiston Respublikasining Konstitutsiyaviy Qonuni bilan belgilanadigan hollar mustasno.","Oʻzbekiston Respublikasi Oliy sudi tomonidan qabul qilingan hujjatlar qatʼiy hisoblanadi va Oʻzbekiston Respublikasining butun hududida bajarilishi majburiydir.","Oʻzbekiston Respublikasi Oliy sudi quyi sudlarning sudlov faoliyati ustidan nazorat olib borish huquqiga ega.","Oʻzbekiston Respublikasi Oliy sudining raisi va uning oʻrinbosarlari Oʻzbekiston Respublikasi Prezidentining taqdimiga binoan Oʻzbekiston Respublikasi Oliy Majlisining Senati tomonidan besh yillik muddatga saylanadi. Ayni bir shaxs surunkasiga ikki muddatdan ortiq Oʻzbekiston Respublikasi Oliy sudining raisi, rais oʻrinbosari etib saylanishi mumkin emas."],"notes":["(134-moddaning birinchi qismi Oʻzbekiston Respublikasining 2026-yil 13-iyuldagi OʻRQ-1158-sonli Konstitutsiyaviy Qonuni tahririda — Qonunchilik maʼlumotlari milliy bazasi, 14.07.2026-y., 03/26/1158/0727-son. Kuchga kirish sanasi — 2026-yil 25-iyul)"]},{"n":135,"anchor":"-6446127","text":["Oʻzbekiston Respublikasi Sudyalar oliy kengashi sudyalar hamjamiyatining mustaqil organi boʻlib, u sudyalar korpusining shakllantirilishini, sud hokimiyati mustaqilligining konstitutsiyaviy prinsipiga rioya etilishini taʼminlaydi.","Oʻzbekiston Respublikasi Sudyalar oliy kengashi raisi va uning oʻrinbosari Oʻzbekiston Respublikasi Prezidentining taqdimiga binoan Oʻzbekiston Respublikasi Oliy Majlisining Senati tomonidan besh yillik muddatga saylanadi. Ayni bir shaxs surunkasiga ikki muddatdan ortiq Oʻzbekiston Respublikasi Sudyalar oliy kengashining raisi, rais oʻrinbosari etib saylanishi mumkin emas.","Oʻzbekiston Respublikasi Sudyalar oliy kengashini tashkil etish va uning faoliyati tartibi qonun bilan belgilanadi."]},{"n":136,"anchor":"-6446133","text":["Sudyalar mustaqildirlar, faqat Konstitutsiya va qonunga boʻysunadilar. Sudyalarning odil sudlovni amalga oshirishga doir faoliyatiga har qanday tarzda aralashishga yoʻl qoʻyilmaydi va bunday aralashish qonunga muvofiq javobgarlikka sabab boʻladi. Sudyalar muayyan ishlar boʻyicha hisobdor boʻlmaydi.","Sudyalar daxlsizdir.","Davlat sudyaning va uning oila aʼzolarining xavfsizligini taʼminlaydi.","Sudyani muayyan ishning muhokamasidan chetlashtirishga, uning vakolatlarini bekor qilishga yoki toʻxtatib turishga, boshqa lavozimga oʻtkazishga faqat qonunda belgilangan tartibda va asoslarga koʻra yoʻl qoʻyiladi. Sudning qayta tashkil etilishi yoki tugatilishi sudyani lavozimidan ozod etish uchun asos boʻlib xizmat qilishi mumkin emas.","Sudyalar senator, davlat hokimiyati vakillik organlarining deputati boʻlishi mumkin emas.","Sudyalar siyosiy partiyalarning aʼzosi boʻlishi, siyosiy harakatlarda ishtirok etishi, shuningdek ilmiy, ijodiy va pedagogik faoliyatdan tashqari haq toʻlanadigan boshqa faoliyat turlari bilan shugʻullanishi mumkin emas."]},{"n":137,"anchor":"-6446143","text":["Hamma sudlarda ishlar ochiq koʻriladi. Ishlarni yopiq majlisda tinglashga qonunda belgilangan hollardagina yoʻl qoʻyiladi."]},{"n":138,"anchor":"-6446147","text":["Sud hokimiyatining hujjatlari barcha davlat organlari va boshqa tashkilotlar, mansabdor shaxslar hamda fuqarolar uchun majburiydir."]},{"n":139,"anchor":"-6446150","text":["Oʻzbekiston Respublikasida sud ishlarini yuritish oʻzbek tilida, qoraqalpoq tilida yoki muayyan joydagi koʻpchilik aholi soʻzlashadigan tilda yoxud qonunga muvofiq boshqa tilda olib boriladi. Sud ishlari olib borilayotgan tilni bilmaydigan sudda qatnashuvchi shaxslarning tarjimon orqali ish materiallari bilan toʻla tanishish va sud ishlarida ishtirok etish huquqi hamda sudda ona tilida soʻzlash huquqi taʼminlanadi."]},{"n":140,"anchor":"-6446153","text":["Sudlarning faoliyatini moliyalashtirish faqat Oʻzbekiston Respublikasining Davlat budjetidan amalga oshiriladi hamda u odil sudlovni toʻliq va mustaqil amalga oshirish imkoniyatini taʼminlashi kerak."]}]},{"title":"XXIV bob. Advokatura","articles":[{"n":141,"anchor":"-6446156","text":["Jismoniy va yuridik shaxslarga malakali yuridik yordam koʻrsatish uchun advokatura faoliyat koʻrsatadi.","Advokatura faoliyati qonuniylik, mustaqillik va oʻzini oʻzi boshqarish prinsiplariga asoslanadi.","Advokaturani tashkil etish va uning faoliyati tartibi qonun bilan belgilanadi."]},{"n":142,"anchor":"-6446160","text":["Advokat oʻz kasbiy vazifalarini amalga oshirayotganda uning faoliyatiga aralashishga yoʻl qoʻyilmaydi.","Advokatga oʻz himoyasidagi shaxs bilan moneliksiz va xoli uchrashish, maslahatlar berish uchun shart-sharoitlar taʼminlanadi.","Advokat, uning shaʼni, qadr-qimmati va kasbiy faoliyati davlat himoyasida boʻladi va qonun bilan muhofaza qilinadi."]}]},{"title":"XXV bob. Prokuratura","articles":[{"n":143,"anchor":"-6446165","text":["Oʻzbekiston Respublikasi hududida qonunlarning aniq va bir xilda bajarilishi ustidan nazoratni Oʻzbekiston Respublikasining Bosh prokurori va unga boʻysunuvchi prokurorlar amalga oshiradi."]},{"n":144,"anchor":"-6446167","text":["Prokuratura organlarining yagona markazlashtirilgan tizimiga Oʻzbekiston Respublikasining Bosh prokurori boshchilik qiladi.","Qoraqalpogʻiston Respublikasining prokurori Oʻzbekiston Respublikasining Bosh prokurori bilan kelishilgan holda Qoraqalpogʻiston Respublikasining oliy vakillik organi tomonidan tayinlanadi.","Viloyatlarning prokurorlari, tuman va shahar prokurorlari Oʻzbekiston Respublikasining Bosh prokurori tomonidan tayinlanadi.","Oʻzbekiston Respublikasi Bosh prokurorining, Qoraqalpogʻiston Respublikasi prokurorining, viloyat, tuman va shahar prokurorlarining vakolat muddati — besh yil.","Ayni bir shaxs surunkasiga ikki muddatdan ortiq Oʻzbekiston Respublikasining Bosh prokurori lavozimini egallashi mumkin emas."]},{"n":145,"anchor":"-6446173","text":["Oʻzbekiston Respublikasining prokuratura organlari oʻz vakolatlarini boshqa davlat organlaridan, oʻzga tashkilotlardan, mansabdor shaxslardan mustaqil ravishda, faqat Oʻzbekiston Respublikasining Konstitutsiyasiga va qonunlariga boʻysungan holda amalga oshiradi.","Prokurorlar oʻz vakolatlari davrida siyosiy partiyalarga va siyosiy maqsadlarni koʻzlovchi boshqa jamoat birlashmalariga aʼzolikni toʻxtatib turadilar.","Prokuratura organlarini tashkil etish, ularning vakolatlari va faoliyat koʻrsatish tartibi qonun bilan belgilanadi."]},{"n":146,"anchor":"-6446177","text":["Oʻzbekiston Respublikasi hududida jinoyatchilikka qarshi kurash boʻyicha tezkor-qidiruv, tergov va boshqa maxsus vazifalarni mustaqil ravishda bajaruvchi xususiy tashkilotlar, jamoat birlashmalari va ularning boʻlinmalarini tuzish hamda ularning faoliyat koʻrsatishi taqiqlanadi.","Qonuniylik va huquqiy tartibotni, fuqarolarning huquqlari va erkinliklarini himoya qilishda huquqni muhofaza qiluvchi organlarga jamoat tashkilotlari va fuqarolar yordam koʻrsatishlari mumkin."]}]},{"title":"XXVI bob. Moliya, pul va bank tizimi","articles":[{"n":147,"anchor":"-6446184","text":["Oʻzbekiston Respublikasi oʻzining yagona moliya, pul va bank tizimiga ega."]},{"n":148,"anchor":"-6446186","text":["Oʻzbekiston Respublikasining Davlat budjeti respublika budjetidan, Qoraqalpogʻiston Respublikasi budjetidan va mahalliy budjetlardan iboratdir.","Oʻzbekiston Respublikasining Davlat budjetini shakllantirish hamda ijro etish tartib-taomillari ochiqlik va shaffoflik prinsiplari asosida amalga oshiriladi.","Fuqarolar va fuqarolik jamiyati institutlari Oʻzbekiston Respublikasi Davlat budjetining shakllantirilishi hamda ijro etilishi ustidan jamoatchilik nazoratini amalga oshiradi.","Fuqarolarning hamda fuqarolik jamiyati institutlarining budjet jarayonida ishtirok etishi tartibi va shakllari qonun bilan belgilanadi."]},{"n":149,"anchor":"-6446191","text":["Oʻzbekiston Respublikasi hududida yagona soliq tizimi amal qiladi. Soliqlarni joriy qilish huquqi Oʻzbekiston Respublikasining Oliy Majlisiga tegishlidir."]},{"n":150,"anchor":"-6446193","text":["Oʻzbekiston Respublikasining pul birligi soʻmdir.","Soʻm Oʻzbekiston Respublikasining butun hududida yagona cheklanmagan qonuniy toʻlov vositasidir.","Oʻzbekiston Respublikasi Markaziy banki Oʻzbekiston Respublikasining hududida qonuniy toʻlov vositalari sifatida pul belgilarini muomalaga kiritishda va ularni muomaladan chiqarishda mutlaq huquqqa egadir."]},{"n":151,"anchor":"-6446198","text":["Oʻzbekiston Respublikasining bank tizimi Oʻzbekiston Respublikasi Markaziy bankidan va banklardan iboratdir.","Oʻzbekiston Respublikasi Markaziy banki pul-kredit va valyuta siyosatini ishlab chiqadi hamda amalga oshiradi.","Oʻzbekiston Respublikasi Markaziy banki mamlakatda banklar faoliyatini tartibga solishni amalga oshiradi, bank va toʻlov tizimlarining barqaror faoliyat koʻrsatishini taʼminlaydi, bundan Oʻzbekiston Respublikasining Konstitutsiyaviy Qonuni bilan maxsus huquqiy rejim oʻrnatilgan hudud mustasno.","Oʻzbekiston Respublikasi Markaziy banki oʻz vazifalarini bajarishda mustaqildir.","Oʻzbekiston Respublikasi Markaziy bankining faoliyatini tashkil etish tartibi qonun bilan belgilanadi."],"notes":["(151-moddaning uchinchi qismi Oʻzbekiston Respublikasining 2026-yil 13-iyuldagi OʻRQ-1158-sonli Konstitutsiyaviy Qonuni tahririda — Qonunchilik maʼlumotlari milliy bazasi, 14.07.2026-y., 03/26/1158/0727-son. Kuchga kirish sanasi — 2026-yil 25-iyul)"]}]},{"title":"XXVII bob. Mudofaa va xavfsizlik","articles":[{"n":152,"anchor":"-6446205","text":["Oʻzbekiston Respublikasi Qurolli Kuchlari Oʻzbekiston Respublikasining davlat suverenitetini va hududiy yaxlitligini, aholining tinch hayoti va xavfsizligini himoya qilish uchun tuziladi.","Qurolli Kuchlarning tuzilishi va ularni tashkil etish qonun bilan belgilanadi."]},{"n":153,"anchor":"-6446209","text":["Oʻzbekiston Respublikasi oʻz xavfsizligini taʼminlash uchun yetarli darajada Qurolli Kuchlariga ega."]}]}]},{"title":"OLTINCHI BOʻLIM. KONSTITUTSIYANI OʻZGARTIRISH TARTIBI","chapters":[{"title":"","articles":[{"n":154,"anchor":"-6446212","text":["Oʻzbekiston Respublikasining Konstitutsiyasiga oʻzgartirish va qoʻshimchalar tegishincha Oʻzbekiston Respublikasi Oliy Majlisining Qonunchilik palatasi deputatlari va Senati aʼzolari umumiy sonining kamida uchdan ikki qismidan iborat koʻpchiligi tomonidan qabul qilingan konstitutsiyaviy qonun yoki Oʻzbekiston Respublikasining referendumi bilan kiritiladi.","Ushbu Konstitutsiya 1-moddasining va ushbu modda ikkinchi qismining qoidalari qayta koʻrib chiqilishi mumkin emas.","Oʻzbekiston Respublikasining Konstitutsiyasiga oʻzgartirish va qoʻshimchalar kiritish toʻgʻrisidagi konstitutsiyaviy qonunda uning normalarini, shuningdek Konstitutsiyaning normalarini qoʻllashning oʻziga xos xususiyatlari nazarda tutilishi mumkin."]},{"n":155,"anchor":"-6446216","text":["Oʻzbekiston Respublikasi Oliy Majlisi tegishli taklif kiritilgandan keyin olti oy mobaynida Konstitutsiyaga oʻzgartirish va qoʻshimchalar kiritish toʻgʻrisida keng va har taraflama muhokamani hisobga olgan holda konstitutsiyaviy qonun qabul qilishi mumkin. Agar Oʻzbekiston Respublikasi Oliy Majlisi Konstitutsiyani oʻzgartirish toʻgʻrisidagi taklifni rad etsa, taklif bir yil oʻtgandan keyingina qayta kiritilishi mumkin."],"notes":["(Qonunchilik maʼlumotlari milliy bazasi, 01.05.2023-y., 03/23/837/0241-son; 14.07.2026-y., 03/26/1158/0727-son)"]}]}]}]};

rights: [
 {cat:"shaxsiy", title:"Yashash huquqi", arts:[25], simple:"Har bir insonning hayoti qonun bilan himoyalangan. Oʻzbekistonda oʻlim jazosi taqiqlangan.", example:"Hech kim, hech qanday sabab bilan boshqa odamning hayotiga tajovuz qilishga haqli emas."},
 {cat:"shaxsiy", title:"Shaʼn va qadr-qimmat", arts:[26], simple:"Seni kamsitish, qiynash yoki sen bilan shafqatsiz muomala qilish mumkin emas.", example:"Oʻqituvchi ham, sinfdosh ham seni hammaning oldida haqoratlashga haqli emas."},
 {cat:"shaxsiy", title:"Erkinlik va shaxsiy daxlsizlik", arts:[27], simple:"Hech kimni qonunsiz ushlab boʻlmaydi. Sud qarorisiz 48 soatdan ortiq ushlab turish mumkin emas.", example:"Ushlangan odamga uning huquqlari va nima uchun ushlangani tushunarli tilda aytilishi shart."},
 {cat:"shaxsiy", title:"Aybsizlik prezumpsiyasi", arts:[28], simple:"Aybi sudda isbotlanmaguncha har kim aybsiz hisoblanadi. Oʻz aybsizligingni isbotlashing shart emas.", example:"Sinfda narsa yoʻqolsa, dalilsiz birorta oʻquvchini \"oʻgʻri\" deb eʼlon qilish notoʻgʻri."},
 {cat:"shaxsiy", title:"Yuridik yordam olish", arts:[29], simple:"Har kim malakali yuridik yordam olishi mumkin, baʼzi hollarda bu yordam davlat hisobidan beriladi.", example:"Ushlangan shaxs oʻzi tanlagan advokat yordamidan foydalanishi mumkin."},
 {cat:"shaxsiy", title:"Shaxsiy hayot va yozishmalar siri", arts:[31], simple:"Shaxsiy hayoting, oilaviy siring, telefon va elektron xabarlaring sir saqlanadi. Shaxsiy maʼlumotlaring himoyalangan.", example:"Birovning telefonini ruxsatsiz ochib, yozishmalarini tarqatish uning huquqini buzadi."},
 {cat:"shaxsiy", title:"Uy-joy daxlsizligi", arts:[31], simple:"Hech kim uyingga u yerda yashovchilarning xohishiga qarshi kira olmaydi, faqat qonunda koʻrsatilgan hollar bundan mustasno.", example:"Uyda tintuv faqat qonunga muvofiq va sud qarori bilan oʻtkaziladi."},
 {cat:"shaxsiy", title:"Erkin harakatlanish", arts:[32], simple:"Mamlakat boʻylab erkin yurish, yashash joyini tanlash va Oʻzbekistonga toʻsqinliksiz qaytish huquqi.", example:"Oilang boshqa viloyatga koʻchib oʻtishi mumkin — bu qonunda belgilangan cheklovlardan tashqari erkin."},
 {cat:"shaxsiy", title:"Fikr, soʻz va axborot erkinligi", arts:[33], simple:"Fikrlash, soʻz va eʼtiqod erkinligi kafolatlangan. Har kim axborotni izlash, olish va tarqatish huquqiga ega.", example:"Maktab gazetasida oʻz fikringni bildirishing mumkin — lekin boshqalarning huquqlarini buzmasdan."},
 {cat:"shaxsiy", title:"Vijdon erkinligi", arts:[35], simple:"Har kim xohlagan dinga eʼtiqod qilishi yoki hech qaysi dinga eʼtiqod qilmasligi mumkin. Diniy qarashlarni majburlab boʻlmaydi.", example:"Sinfdoshingning eʼtiqodi seniki bilan bir xil boʻlmasa ham, u bilan teng muomala qil."},
 {cat:"siyosiy", title:"Davlat ishlarida ishtirok etish", arts:[36], simple:"Fuqarolar jamiyat va davlat ishlarini boshqarishda bevosita yoki oʻz vakillari orqali ishtirok etadi.", example:"Jamoatchilik nazorati, referendum va saylovlar — ishtirok etish yoʻllari."},
 {cat:"siyosiy", title:"Yigʻilish va namoyishlar", arts:[38], simple:"Fuqarolar qonunga muvofiq mitinglar, yigʻilishlar va namoyishlar oʻtkazishi mumkin.", example:"Hokimiyat bunday tadbirlarni faqat xavfsizlik nuqtai nazaridan toʻxtatishi yoki taqiqlashi mumkin."},
 {cat:"siyosiy", title:"Birlashmalarga uyushish", arts:[39,73], simple:"Kasaba uyushmalari, partiyalar va boshqa jamoat birlashmalariga aʼzo boʻlish huquqi.", example:"Kasaba uyushmasiga aʼzo boʻlish ixtiyoriy — hech kim majburlay olmaydi."},
 {cat:"siyosiy", title:"Murojaat qilish huquqi", arts:[40], simple:"Davlat organlari, tashkilotlar va mansabdor shaxslarga ariza, taklif va shikoyat yuborish mumkin. Ular belgilangan muddatda koʻrib chiqilishi shart.", example:"Oʻquvchilar maktab hovlisini obodonlashtirish boʻyicha hokimlikka birgalikda taklif yozishi mumkin."},
 {cat:"siyosiy", title:"Saylash va saylanish", arts:[128], simple:"18 yoshga toʻlgan fuqarolar saylash huquqiga ega. Har bir saylovchi bir ovozga ega, ovoz berish yashirin.", example:"Siz hali saylovda ovoz bermasangiz ham, maktab yoki yoshlar kengashi saylovlarida tajriba orttirishingiz mumkin."},
 {cat:"iqtisodiy", title:"Mulkdor boʻlish", arts:[41,65], simple:"Har kim mulkdor boʻlishi mumkin. Xususiy mulk daxlsiz, undan faqat qonunda koʻrsatilgan tartibda va sud qarori bilan mahrum etish mumkin.", example:"Sening velosiped yoki telefoning — sening mulking, uni hech kim oʻzboshimchalik bilan olib qoʻya olmaydi."},
 {cat:"iqtisodiy", title:"Munosib mehnat", arts:[42], simple:"Kasbni erkin tanlash, xavfsiz sharoitda ishlash va kamsitishlarsiz adolatli haq olish huquqi.", example:"Homiladorligi yoki bolasi borligi sababli ayolni ishga olmaslik taqiqlangan."},
 {cat:"iqtisodiy", title:"Majburiy mehnat va bolalar mehnati taqiqi", arts:[44], simple:"Majburiy mehnat taqiqlangan. Bolaning sogʻligʻiga, xavfsizligiga, rivojlanishiga yoki oʻqishiga zarar yetkazadigan mehnat taqiqlangan.", example:"Oʻquvchini dars vaqtida ogʻir ishga jalb qilish mumkin emas."},
 {cat:"iqtisodiy", title:"Dam olish", arts:[45], simple:"Har kim dam olish huquqiga ega. Ishlovchilar uchun ish vaqti, dam olish kunlari va har yilgi taʼtil belgilanadi.", example:"Bayram kunlari ham dam olish huquqining bir qismi."},
 {cat:"ijtimoiy", title:"Ijtimoiy taʼminot", arts:[46], simple:"Qariganda, mehnat qobiliyatini yoʻqotganda, ishsizlikda yoki boquvchisini yoʻqotganda davlat yordami.", example:"Pensiya va nafaqalar rasman belgilangan eng kam isteʼmol xarajatlaridan kam boʻlishi mumkin emas."},
 {cat:"ijtimoiy", title:"Uy-joyli boʻlish", arts:[47], simple:"Har kim uy-joyli boʻlish huquqiga ega. Hech kimni sud qarorisiz uy-joyidan mahrum etib boʻlmaydi.", example:"Davlat uy-joy qurilishini ragʻbatlantiradi."},
 {cat:"ijtimoiy", title:"Sogʻliqni saqlash", arts:[48], simple:"Malakali tibbiy xizmatdan foydalanish huquqi. Fuqarolar tibbiy yordamning kafolatlangan hajmini davlat hisobidan oladi.", example:"Davlat sport va sogʻlom turmush tarzi uchun ham sharoit yaratadi."},
 {cat:"ijtimoiy", title:"Nogironligi boʻlgan shaxslar huquqlari", arts:[57], simple:"Nogironligi boʻlgan shaxslar davlat himoyasida: taʼlim, ish va axborotdan toʻliq foydalanishlari uchun sharoit yaratiladi.", example:"Maktabga kirish uchun pandus boʻlishi — teng imkoniyatning amaliy koʻrinishi."},
 {cat:"ijtimoiy", title:"Xotin-qizlar va erkaklar tengligi", arts:[58], simple:"Xotin-qizlar va erkaklar teng huquqli. Davlat ularga hayotning barcha sohalarida teng imkoniyat beradi.", example:"Qizlar ham, oʻgʻil bolalar ham sinf sardori yoki robototexnika toʻgaragi aʼzosi boʻla oladi."},
 {cat:"madaniy", title:"Taʼlim olish", arts:[50], simple:"Har kim taʼlim olish huquqiga ega. Umumiy oʻrta taʼlim bepul va majburiy.", example:"Alohida taʼlim ehtiyojlari boʻlgan bolalar uchun inklyuziv taʼlim taʼminlanadi."},
 {cat:"madaniy", title:"Oliy taʼlim", arts:[51], simple:"Fuqarolar davlat oliy taʼlim tashkilotlarida tanlov asosida davlat hisobidan oʻqishi mumkin.", example:"Yaxshi tayyorgarlik — grant asosida oʻqishga yoʻl."},
 {cat:"madaniy", title:"Ijod erkinligi", arts:[53], simple:"Ilmiy, texnikaviy va badiiy ijod erkinligi. Intellektual mulk — ixtiro, kitob, musiqa — qonun bilan himoyalangan.", example:"Sen yaratgan ilova yoki chizgan rasm — sening intellektual mulking."},
 {cat:"madaniy", title:"Qulay atrof-muhit", arts:[49], simple:"Har kim qulay atrof-muhitga va uning holati haqida ishonchli axborotga ega boʻlish huquqiga ega.", example:"Davlat Orolboʻyi mintaqasi ekotizimini tiklash choralarini koʻradi."}

 {title:"Boshqalarning huquqlarini hurmat qilish", arts:[60,21], simple:"Oʻz huquqingdan foydalanayotganda boshqalarning huquq va qadr-qimmatiga putur yetkazmaslik kerak.", example:"Soʻz erkinligi boshqalarni haqoratlash huquqini bermaydi."},
 {title:"Tarixiy va madaniy merosni asrash", arts:[61], simple:"Xalqning tarixiy, maʼnaviy, madaniy, ilmiy va tabiiy merosini asrab-avaylash — fuqarolar burchi.", example:"Qadimiy obidalar devoriga yozuv yozmaslik."},
 {title:"Tabiatga ehtiyotkorlik", arts:[62], simple:"Fuqarolar atrof tabiiy muhitga ehtiyotkorona munosabatda boʻlishga majbur.", example:"Daraxt ekish, chiqindini saralash, suvni tejash."},
 {title:"Soliq toʻlash", arts:[63], simple:"Fuqarolar qonunda belgilangan soliq va yigʻimlarni toʻlashi shart. Soliqlar adolatli boʻlishi kerak.", example:"Maktablar, shifoxonalar va yoʻllar soliqlar hisobidan quriladi."},

quiz: [
 {lvl:1, q:"Oʻzbekiston Respublikasining davlat tili qaysi?", o:["Rus tili","Oʻzbek tili","Qoraqalpoq tili","Ingliz tili"], a:1, art:4, why:"4-modda: davlat tili — oʻzbek tili. Davlat boshqa millat va elatlarning tillari hurmat qilinishini ham taʼminlaydi."},
 {lvl:1, q:"Oʻzbekistonning davlat ramzlari qaysilar?", o:["Bayroq, gerb va madhiya","Bayroq va poytaxt","Gerb va pul birligi","Madhiya va Konstitutsiya"], a:0, art:5, why:"5-modda: davlat ramzlari — bayrogʻi, gerbi va madhiyasi. Ular davlat himoyasida."},
 {lvl:1, q:"Konstitutsiyaga koʻra Oʻzbekistonning poytaxti qaysi shahar?", o:["Samarqand","Buxoro","Toshkent","Nukus"], a:2, art:6, why:"6-modda: poytaxt — Toshkent shahri."},
 {lvl:1, q:"Davlat hokimiyatining birdan-bir manbai kim?", o:["Prezident","Xalq","Oliy Majlis","Sud"], a:1, art:7, why:"7-modda: xalq davlat hokimiyatining birdan-bir manbaidir."},
 {lvl:1, q:"Oʻzbekistonda oʻlim jazosi haqida Konstitutsiya nima deydi?", o:["Faqat ogʻir jinoyatlar uchun qoʻllanadi","Sud xohishiga koʻra qoʻllanadi","Taqiqlanadi","Referendum hal qiladi"], a:2, art:25, why:"25-modda: Oʻzbekiston Respublikasida oʻlim jazosi taqiqlanadi."},
 {lvl:1, q:"Umumiy oʻrta taʼlim haqida qaysi gap toʻgʻri?", o:["Ixtiyoriy va pullik","Bepul va majburiy","Faqat shaharlarda majburiy","Faqat 9-sinfgacha bepul"], a:1, art:50, why:"50-modda: davlat bepul umumiy oʻrta taʼlimni kafolatlaydi, u majburiydir."},
 {lvl:1, q:"Necha yoshga toʻlgan fuqarolar saylash huquqiga ega?", o:["16","18","21","25"], a:1, art:128, why:"128-modda: oʻn sakkiz yoshga toʻlgan fuqarolar saylash huquqiga ega."},
 {lvl:1, q:"Oʻzbekistonning pul birligi nima?", o:["Tanga","Soʻm","Dollar","Tilla"], a:1, art:150, why:"150-modda: pul birligi — soʻm."},
 {lvl:1, q:"Xotin-qizlar va erkaklarning huquqlari haqida Konstitutsiya nima deydi?", o:["Erkaklar koʻproq huquqqa ega","Ular teng huquqli","Faqat ishda teng","Bu qonunlar bilan hal qilinadi"], a:1, art:58, why:"58-modda: xotin-qizlar va erkaklar teng huquqlidirlar."},
 {lvl:1, q:"Quyidagilardan qaysi biri fuqaroning burchi?", o:["Dam olish","Tabiatga ehtiyotkorona munosabatda boʻlish","Mulkdor boʻlish","Axborot olish"], a:1, art:62, why:"62-modda: fuqarolar atrof tabiiy muhitga ehtiyotkorona munosabatda boʻlishga majburdirlar."},
 {lvl:1, q:"Senzura haqida Konstitutsiya nima deydi?", o:["Senzuraga yoʻl qoʻyilmaydi","Faqat televideniyeda boʻladi","Maktablarda majburiy","Hokim belgilaydi"], a:0, art:82, why:"82-modda: senzuraga yoʻl qoʻyilmaydi."},
 {lvl:1, q:"Inson huquq va erkinliklari qachondan boshlab har kimga tegishli boʻladi?", o:["Pasport olgandan keyin","18 yoshdan","Tugʻilganidan boshlab","Maktabga borgandan keyin"], a:2, art:19, why:"19-modda: inson huquq va erkinliklari har kimga tugʻilganidan boshlab tegishli boʻladi."},
 {lvl:2, q:"Shaxsni sud qarorisiz eng koʻpi bilan qancha muddat ushlab turish mumkin?", o:["24 soat","48 soat","72 soat","7 kun"], a:1, art:27, why:"27-modda: shaxs sudning qarorisiz qirq sakkiz soatdan ortiq muddat ushlab turilishi mumkin emas."},
 {lvl:2, q:"Ayblanuvchi oʻz aybsizligini isbotlashi shartmi?", o:["Ha, har doim","Faqat advokat boʻlmasa","Yoʻq, shart emas","Faqat sud talab qilsa"], a:2, art:28, why:"28-modda: gumon qilinuvchi, ayblanuvchi yoki sudlanuvchi oʻz aybsizligini isbotlashi shart emas."},
 {lvl:2, q:"Inson va davlat organlari munosabatida qonundagi noaniqliklar kimning foydasiga talqin etiladi?", o:["Davlat organining","Sudning","Insonning","Koʻpchilikning"], a:2, art:20, why:"20-modda: barcha ziddiyat va noaniqliklar inson foydasiga talqin etiladi."},
 {lvl:2, q:"Uyda tintuv oʻtkazish uchun nima zarur?", o:["Qoʻshnilarning roziligi","Qonunga muvofiq sud qarori","Mahalla raisining ruxsati","Hech narsa"], a:1, art:31, why:"31-modda: uy-joyda tintuv faqat qonunga muvofiq va sudning qaroriga asosan oʻtkaziladi."},
 {lvl:2, q:"Internet haqida Konstitutsiyada nima yozilgan?", o:["Internet taqiqlanishi mumkin","Davlat internetdan foydalanish uchun shart-sharoit yaratadi","Internet faqat 18 yoshdan","Internet haqida hech narsa yoʻq"], a:1, art:33, why:"33-modda: davlat Internet jahon axborot tarmogʻidan foydalanishni taʼminlash uchun shart-sharoitlar yaratadi."},
 {lvl:2, q:"Bolalar mehnatining qaysi shakllari taqiqlanadi?", o:["Faqat zavoddagi ish","Sogʻliq, xavfsizlik, rivojlanish yoki taʼlimga xavf soluvchi har qanday shakli","Faqat 12 yoshgacha boʻlgan bolalar mehnati","Hech qaysi"], a:1, art:44, why:"44-modda: bolaning sogʻligʻiga, xavfsizligiga, axloqiga, rivojlanishiga xavf soluvchi, taʼlim olishiga toʻsqinlik qiluvchi har qanday shakllari taqiqlanadi."},
 {lvl:2, q:"Oʻzbekiston fuqarosini boshqa davlatga berib yuborish mumkinmi?", o:["Ha, soʻrov boʻlsa","Yoʻq, mumkin emas","Faqat Prezident ruxsati bilan","Faqat jinoyat sodir etsa"], a:1, art:23, why:"23-modda: fuqaro Oʻzbekistondan tashqariga majburiy chiqarib yuborilishi yoki boshqa davlatga berib yuborilishi mumkin emas."},
 {lvl:2, q:"Oliy maʼlumotni davlat hisobidan qanday olish mumkin?", o:["Hamma uchun avtomatik","Davlat taʼlim tashkilotlarida tanlov asosida","Faqat aʼlochilar uchun","Faqat qishloq yoshlari uchun"], a:1, art:51, why:"51-modda: fuqarolar davlat taʼlim tashkilotlarida tanlov asosida davlat hisobidan oliy maʼlumot olishga haqli."},
 {lvl:2, q:"Arizalar, takliflar va shikoyatlar qanday koʻrib chiqilishi kerak?", o:["Xohlagan vaqtda","Qonunda belgilangan tartibda va muddatlarda","Faqat imzolar koʻp boʻlsa","Faqat elektron shaklda"], a:1, art:40, why:"40-modda: ular qonunda belgilangan tartibda va muddatlarda koʻrib chiqilishi shart."},
 {lvl:2, q:"Kasaba uyushmasiga aʼzo boʻlish...", o:["Majburiy","Ixtiyoriy","Faqat davlat xizmatchilari uchun","Taqiqlangan"], a:1, art:73, why:"73-modda: kasaba uyushmalariga aʼzo boʻlish ixtiyoriydir."},
 {lvl:2, q:"Hamma sudlarda ishlar qanday koʻriladi?", o:["Yopiq","Ochiq, yopiq majlis faqat qonunda belgilangan hollarda","Faqat onlayn","Faqat jurnalistlarsiz"], a:1, art:137, why:"137-modda: hamma sudlarda ishlar ochiq koʻriladi."},
 {lvl:2, q:"Voyaga yetgan farzandlarning qanday burchi bor?", o:["Ota-onasi bilan yashash","Mehnatga layoqatli boʻlsa, ota-onasi haqida gʻamxoʻrlik qilish","Ota-onasining kasbini tanlash","Burchi yoʻq"], a:1, art:80, why:"80-modda: voyaga yetgan mehnatga layoqatli farzandlar ota-onalari haqida gʻamxoʻrlik qilishga majbur."},
 {lvl:3, q:"Yangi tahrirdagi Konstitutsiya nechta moddadan iborat?", o:["128","146","155","163"], a:2, art:155, why:"Konstitutsiya muqaddima, 6 boʻlim, 27 bob va 155 moddadan iborat."},
 {lvl:3, q:"Prezident necha yil muddatga saylanadi?", o:["4","5","7","10"], a:2, art:106, why:"106-modda: Prezident yetti yil muddatga saylanadi; bir shaxs surunkasiga ikki muddatdan ortiq Prezident boʻlishi mumkin emas."},
 {lvl:3, q:"Prezidentlikka nomzod kamida necha yoshda boʻlishi kerak?", o:["25","30","35","40"], a:2, art:106, why:"106-modda: oʻttiz besh yoshdan kichik boʻlmagan, davlat tilini yaxshi biladigan fuqaro saylanishi mumkin."},
 {lvl:3, q:"Oliy Majlis qaysi palatalardan iborat?", o:["Qonunchilik palatasi va Senat","Senat va Vazirlar Mahkamasi","Faqat bitta palata","Konstitutsiyaviy sud va Senat"], a:0, art:91, why:"91-modda: Oliy Majlis ikki palatadan — Qonunchilik palatasi (quyi) va Senatdan (yuqori) iborat."},
 {lvl:3, q:"Qonunchilik palatasi nechta deputatdan iborat?", o:["100","120","150","200"], a:2, art:92, why:"92-modda: Qonunchilik palatasi bir yuz ellik deputatdan iborat."},
 {lvl:3, q:"Qonunchilik palatasi deputati yoki senator boʻlish uchun saylov kuni kamida necha yosh boʻlishi kerak?", o:["18","21","25","30"], a:2, art:92, why:"92-modda: saylov kuni yigirma besh yoshga toʻlgan va kamida besh yil Oʻzbekistonda muqim yashayotgan fuqaro."},
 {lvl:3, q:"Konstitutsiyaviy sud sudyalari qancha muddatga saylanadi?", o:["5 yil, qayta saylanish huquqi bilan","7 yil","10 yil, qayta saylanish huquqisiz","Umrbod"], a:2, art:132, why:"132-modda: sudyalar qayta saylanish huquqisiz oʻn yillik muddatga saylanadi."},
 {lvl:3, q:"Konstitutsiyaning qaysi qoidalarini qayta koʻrib chiqish mumkin emas?", o:["1-modda va 154-moddaning ikkinchi qismi","Barcha moddalarni oʻzgartirish mumkin","Faqat muqaddimani","6-moddani"], a:0, art:154, why:"154-modda: ushbu Konstitutsiya 1-moddasining va 154-modda ikkinchi qismining qoidalari qayta koʻrib chiqilishi mumkin emas."},
 {lvl:3, q:"Oliy Majlis palatalarining vakolat muddati qancha?", o:["4 yil","5 yil","7 yil","10 yil"], a:1, art:91, why:"91-modda: Qonunchilik palatasi va Senati vakolat muddati — besh yil."},
 {lvl:3, q:"Qanday hollarda insonning huquq va erkinliklarini cheklash mumkin?", o:["Mansabdor shaxs xohlasa","Faqat qonunga muvofiq va konstitutsiyaviy tuzum, sogʻliq, axloq, boshqalar huquqi, xavfsizlik va tartibni himoya qilish uchun zarur doirada","Hech qachon","Har qanday vaqtda"], a:1, art:21, why:"21-modda: cheklash faqat qonunga muvofiq va sanab oʻtilgan maqsadlar uchun zarur boʻlgan doirada mumkin."},
 {lvl:3, q:"Fuqaro Konstitutsiyaviy sudga qachon shikoyat bilan murojaat qila oladi?", o:["Istalgan paytda","Sud orqali himoyaning boshqa barcha vositalaridan foydalanib boʻlganda, unga qoʻllanilgan qonun ustidan","Faqat Prezident ruxsati bilan","Fuqarolar murojaat qila olmaydi"], a:1, art:133, why:"133-modda: barcha boshqa vositalardan foydalanib boʻlingach, oʻziga nisbatan qoʻllanilgan qonunning Konstitutsiyaga muvofiqligi toʻgʻrisida shikoyat qilishga haqli."},
 {lvl:3, q:"Qaysi dalillardan sudda foydalanish mumkin emas?", o:["Guvohlar koʻrsatmalaridan","Qonunni buzgan holda olingan dalillardan","Hujjatlardan","Video yozuvlardan"], a:1, art:29, why:"29-modda: qonunni buzgan holda olingan dalillardan odil sudlovda foydalanishga yoʻl qoʻyilmaydi."}
],

situations: [
 {title:"Ruxsatsiz ochilgan telefon", story:"Dilnoza tanaffusda telefonini partada qoldirdi. Sinfdoshi Bekzod uni ochib, Dilnozaning dugonasi bilan yozishmalarini skrinshot qildi va sinf guruhiga tashladi. Hamma kulib, izoh yoza boshladi.", q1:{o:["Yozishmalar siri va shaxsiy hayot daxlsizligi","Taʼlim olish huquqi","Mulkdor boʻlish huquqi"], a:0}, q2:{o:[31,50,45], a:0}, steps:["Skrinshotlarni oʻchirishni soʻra va guruh adminiga murojaat qil.","Sinf rahbari va ota-onangga voqeani aytib ber — yolgʻiz hal qilishga urinma.","Esingda tut: maʼlumot tarqatgan odam ham, uni qayta yuborganlar ham boshqaning huquqini buzadi."]},
 {title:"Pandussiz maktab", story:"Sardor aravachada harakatlanadi. Oilasi uni uyiga yaqin maktabga yozdirmoqchi, ammo maʼmuriyat: \"Bizda sharoit yoʻq, maxsus maktabga boring\", deydi.", q1:{o:["Inklyuziv taʼlim olish huquqi","Dam olish huquqi","Erkin harakatlanish huquqi"], a:0}, q2:{o:[50,32,45], a:0}, steps:["Ota-ona bilan birga xalq taʼlimi boʻlimiga yozma ariza bilan murojaat qilish mumkin (40-modda).","Konstitutsiyaga koʻra, taʼlim tashkilotlarida alohida ehtiyojli bolalar uchun inklyuziv taʼlim taʼminlanadi.","Davlat nogironligi boʻlgan shaxslarning taʼlim olishiga koʻmaklashadi (57-modda)."]},
 {title:"Dars oʻrniga bozor", story:"14 yoshli Jasurni qarindoshi oʻquv kunlari ertalabdan kechgacha bozorda ogʻir qoplar tashishga olib ketyapti. Jasur darslarni qoldirib, charchab qolmoqda.", q1:{o:["Bolalar mehnatidan himoyalanish va taʼlim olish huquqi","Mulk huquqi","Soʻz erkinligi"], a:0}, q2:{o:[44,41,33], a:0}, steps:["Bunday mehnat Jasurning sogʻligʻiga va oʻqishiga zarar yetkazmoqda — bu taqiqlangan.","Sinf rahbari, maktab psixologi yoki mahalla bilan gaplashish kerak.","Bolalar huquqlari boʻyicha vakolatli organlarga (masalan, Bola huquqlari boʻyicha vakil — ombudsman) murojaat qilish mumkin."]},
 {title:"\"Sen bizdan emassan\"", story:"Sinfga boshqa shahardan yangi oʻquvchi keldi. U oʻzbek tilida biroz qiynalib gapiradi. Baʼzi bolalar uning talaffuzini masxara qilib, guruh loyihasiga qoʻshmayapti.", q1:{o:["Qonun oldida tenglik va qadr-qimmat huquqi","Soliq toʻlash burchi","Saylash huquqi"], a:0}, q2:{o:[19,63,128], a:0}, steps:["Tili va millatidan qatʼi nazar, hamma teng (19-modda); hech narsa kamsitish uchun asos boʻla olmaydi (26-modda).","Yangi sinfdoshni guruhga taklif qil — bu ham fuqarolik burchi: boshqalarning qadr-qimmatini hurmat qilish (60-modda).","Masxara davom etsa, sinf rahbariga ayt."]},
 {title:"Kesilayotgan daraxtlar", story:"Maktab yonidagi bogʻdagi eski chinorlar kesila boshladi. Oʻquvchilar nima boʻlayotganini bilmaydi, ammo ular uchun bu bogʻ — sevimli joy.", q1:{o:["Qulay atrof-muhit va u haqda axborot olish huquqi","Uy-joy daxlsizligi","Dam olish huquqi"], a:0}, q2:{o:[49,47,45], a:0}, steps:["Har kim atrof-muhit holati haqida ishonchli axborot olish huquqiga ega (49-modda).","Sinf jamoasi boʻlib hokimlikka yozma murojaat yoʻllash mumkin (40-modda) — javob qonunda belgilangan muddatda berilishi shart.","Tabiatni asrash — huquqingiz bilan birga burchingiz ham (62-modda)."]},
 {title:"Kamsituvchi post", story:"Kimdir ijtimoiy tarmoqda Malikaning ruxsatsiz olingan suratini qoʻyib, ostiga kamsituvchi izoh yozdi. Post tez tarqalmoqda.", q1:{o:["Shaʼn, qadr-qimmat va shaxsiy maʼlumotlar himoyasi","Mehnat huquqi","Erkin harakatlanish"], a:0}, q2:{o:[26,42,32], a:0}, steps:["Postni skrinshot qilib dalil sifatida saqla, lekin uni oʻzing tarqatma.","Platformaga shikoyat yubor va ota-onang, sinf rahbaringga ayt.","Har kim shaxsiga doir maʼlumotlar himoya qilinishini va noqonuniy toʻplangan maʼlumotlar oʻchirilishini talab qilishga haqli (31-modda)."]},
 {title:"Ushlangan aka", story:"Otabekning 19 yoshli akasini koʻchada ushlab, boʻlimga olib ketishdi. Unga nima uchun ushlanganini aytishmadi, advokat soʻraganida eʼtibor berishmadi.", q1:{o:["Ushlanganda huquqlarini bilish va advokat yordamidan foydalanish huquqi","Taʼlim olish huquqi","Mulk huquqi"], a:0}, q2:{o:[29,50,41], a:0}, steps:["Ushlash chogʻida shaxsga tushunarli tilda huquqlari va ushlash asoslari tushuntirilishi shart (27-modda).","Harakatlanish erkinligi cheklangan paytdan boshlab advokat yordamidan foydalanish huquqi bor (29-modda).","Sud qarorisiz 48 soatdan ortiq ushlab turish mumkin emas (27-modda). Oila advokat bilan bogʻlanishi kerak."]},
 {title:"Darsga kirish uchun pul", story:"Yangi oʻquv yili boshida maktabda bir oʻquvchiga: \"Maʼlum summa toʻlamasang, darsga qoʻyilmaysan\", deyishdi.", q1:{o:["Bepul umumiy oʻrta taʼlim olish huquqi","Senzura taqiqi","Soliq toʻlash burchi"], a:0}, q2:{o:[50,82,63], a:0}, steps:["Davlat bepul umumiy oʻrta taʼlimni kafolatlaydi (50-modda) — darsga qoʻymaslik uchun toʻlov sabab boʻla olmaydi.","Ota-ona maktab direktori yoki taʼlim boʻlimiga yozma murojaat qilishi mumkin (40-modda).","Ixtiyoriy xayriya bilan majburiy toʻlovni farqlang: majburlash mumkin emas."]}
],
glossary: [
 {t:"Konstitutsiya", d:"Davlatning Asosiy qonuni. Boshqa barcha qonunlar unga zid boʻlmasligi kerak."},
 {t:"Modda", d:"Konstitutsiya yoki qonunning raqamlangan qismi."},
 {t:"Huquq", d:"Insonga qonun bilan kafolatlangan imkoniyat: nimadir qilish yoki talab qilish."},
 {t:"Burch", d:"Fuqaro bajarishi shart boʻlgan majburiyat."},
 {t:"Daxlsizlik", d:"Hech kim buzishi yoki tegishi mumkin boʻlmagan holat; masalan, shaxsiy hayot daxlsizligi."},
 {t:"Kafolat", d:"Huquq amalda bajarilishini taʼminlovchi vaʼda hamda mexanizm."},
 {t:"Aybsizlik prezumpsiyasi", d:"Aybi sudda isbotlanmaguncha shaxs aybsiz hisoblanishi."},
 {t:"Referendum", d:"Muhim masala boʻyicha umumxalq ovoz berishi."},

 {t:"Inklyuziv taʼlim", d:"Alohida ehtiyojli bolalarning boshqalar bilan birga oʻqishi."},
 {t:"Ombudsman", d:"Inson huquqlari boʻyicha vakil; fuqarolar huquqlari himoyasiga koʻmaklashadi."},
 {t:"Advokat", d:"Insonga malakali yuridik yordam koʻrsatadigan mutaxassis."},

],
sources: [
 {name:"Oʻzbekiston Respublikasi Konstitutsiyasi (lotin yozuvida)", url:"https://lex.uz/docs/-6445145", note:"Qonunchilik maʼlumotlari milliy bazasi — rasmiy matn. Ushbu saytdagi barcha moddalar shu manbadan olingan."},
 {name:"Oʻzbekiston Respublikasi Konstitutsiyasi (kirill yozuvida)", url:"https://lex.uz/docs/6445145", note:"Rasmiy matnning kirill yozuvidagi varianti."},
 {name:"Qonunchilik maʼlumotlari milliy bazasi — lex.uz", url:"https://lex.uz/", note:"Barcha amaldagi qonun hujjatlarini izlash."},
 {name:"Referendum toʻgʻrisidagi hujjat", url:"https://lex.uz/docs/6449033", note:"2023-yil 30-aprel referendumiga oid rasmiy hujjat."},
 {name:"Davlat portali: Konstitutsiya haqida", url:"https://gov.uz/oz/investmiit/pages/o-zbekiston-respublikasi-konstitutsiyasi", note:"Yangi tahrirning qabul qilinishi haqida qisqacha maʼlumot."}
]
};
